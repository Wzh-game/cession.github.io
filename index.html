/* ==================== 执行攻击 ==================== */
function performAttack(caster, target, power, type, resolve){
  const { dmg, crit } = calcDamage(caster, target, power, type);
  target.hp = Math.max(0, target.hp - dmg);
  
  if (target.hp <= 0){
    target.alive = false;
  }
  
  // 动画
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  const isAlly = caster.isPlayer || caster.isPet;
  const cls = isAlly ? 'good' : 'bad';
  blog(
    `${crit ? '💥' : '⚔️'} <b>${caster.name}</b> 攻击 <b>${target.name}</b>，造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    cls
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  setTimeout(resolve, 350);
}

/* ==================== 应用技能 ==================== */
function applySkill(caster, skill, target){
  // 治疗技能
  if (skill.type === 'heal'){
    const power = skill.power;
    const stat = caster.magic || caster.atk;
    const amount = Math.floor(stat * power * 1.5);
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + amount);
    const actual = caster.hp - before;
    if (skill.id === 'jin') caster.guard = true;
    
    // 同步玩家血量
    if (caster.isPlayer){ P.hp = caster.hp; P.mp = caster.mp; }
    
    showDamageFloat(caster.id, `+${actual}`, 'heal');
    blog(`✨ <b>${caster.name}</b> 施展【${skill.name}】，恢复 <b>${actual}</b> 点气血！`, 'good');
    renderBattleUnits();
    return;
  }
  
  // 封印/定身
  if (skill.type === 'debuff'){
    if (!target) return;
    target.stun = (target.stun || 0) + 2;
    blog(`🔒 <b>${caster.name}</b> 施展【${skill.name}】，<b>${target.name}</b> 被定身 2 回合！`, 'warn');
    renderBattleUnits();
    return;
  }
  
  // 攻击技能
  let targets;
  if (skill.target === 'all'){
    targets = battle.units.filter(u => u.alive && (caster.isEnemy ? !u.isEnemy : u.isEnemy));
  } else {
    targets = [target];
  }
  
  targets.forEach(t => {
    if (!t || !t.alive) return;
    const { dmg, crit } = calcDamage(caster, t, skill.power, skill.type);
    t.hp = Math.max(0, t.hp - dmg);
    if (t.hp <= 0) t.alive = false;
    
    shakeUnit(t.id);
    showDamageFloat(t.id, `-${dmg}`, crit ? 'crit' : '');
    
    const isAlly = caster.isPlayer || caster.isPet;
    blog(
      `${crit ? '💥' : '✨'} <b>${caster.name}</b> 施展【${skill.name}】，对 <b>${t.name}</b> 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
      isAlly ? 'good' : 'bad'
    );
    
    if (!t.alive){
      blog(`☠️ <b>${t.name}</b> 倒下了！`, 'warn');
    }
  });
  
  // 普度众生：攻击同时回血
  if (skill.id === 'pu'){
    const healAmt = Math.floor((caster.magic || caster.atk) * 0.8);
    caster.hp = Math.min(caster.maxHp, caster.hp + healAmt);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `+${healAmt}`, 'heal');
    blog(`💚 <b>${caster.name}</b> 同时恢复了 <b>${healAmt}</b> 点气血。`, 'good');
  }
  
  // 破釜沉舟：自损
  if (skill.id === 'po'){
    const selfDmg = Math.floor(caster.hp * 0.1);
    caster.hp = Math.max(1, caster.hp - selfDmg);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `-${selfDmg}`, '');
    blog(`💔 <b>${caster.name}</b> 燃烧气血，自损 <b>${selfDmg}</b> 点。`, 'dim');
  }
  
  renderBattleUnits();
}

/* ==================== 召唤兽回合 ==================== */
async function petTurn(unit){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  if (!enemies.length) return;
  const target = enemies.reduce((a, b) => a.hp < b.hp ? a : b);
  unit.petActionCount=(unit.petActionCount||0)+1;
  const skill=unit.petSkill;
  if(skill&&unit.petActionCount%3===0){
    const rank=Math.max(1,Math.min(3,unit.petSkillRank||1));
    if(skill.type==='heal'){
      const amount=Math.max(1,Math.floor(unit.maxHp*skill.power*rank));
      const actual=Math.min(unit.maxHp-unit.hp,amount);unit.hp+=actual;
      showDamageFloat(unit.id,'+'+actual,'heal');
      blog('🌸 <b>'+unit.name+'</b> 施展【'+skill.name+'】，恢复 '+actual+' 点气血！','good');
    }else{
      blog('✨ <b>'+unit.name+'</b> 施展【'+skill.name+'】！','good');await sleep(250);
      const {dmg,crit}=calcDamage(unit,target,skill.power+(rank-1)*.18,skill.type);
      target.hp=Math.max(0,target.hp-dmg);if(target.hp<=0)target.alive=false;
      shakeUnit(target.id);showDamageFloat(target.id,'-'+dmg,crit?'crit':'');
      blog('🐾 技能命中 <b>'+target.name+'</b>，造成 <b>'+dmg+'</b> 点伤害'+(crit?'（暴击）':''),'good');
      if(skill.effect==='stun'&&target.alive&&Math.random()<.2){target.stun=Math.max(target.stun||0,1);blog('❄️ '+target.name+' 被寒霜定身！','good');}
      if(skill.effect==='burn'&&target.alive){const burn=Math.max(1,Math.floor(unit.atk*.15*rank));target.hp=Math.max(0,target.hp-burn);if(target.hp<=0)target.alive=false;showDamageFloat(target.id,'灼烧 -'+burn,'');blog('🔥 日曜余焰追加 '+burn+' 点伤害！','good');}
    }
    renderBattleUnits();await sleep(300);return;
  }
  blog(`🐾 <b>${unit.name}</b> 扑向 <b>${target.name}</b>！`);
  await sleep(250);
  const { dmg, crit } = calcDamage(unit, target, 1.0, 'phys');
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp <= 0) target.alive = false;
  
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  blog(
    `${crit ? '💥' : '🐾'} 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    'good'
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  await sleep(300);
}

/* ==================== 五大 Boss 专属战斗机制 ==================== */
async function bossTurn(unit){
 const allies=battle.units.filter(u=>u.alive&&!u.isEnemy);
 if(!allies.length)return;
 const vulnerable=allies.filter(a=>!(a.isPlayer&&a.invulnerableUntil>Date.now()));
 if(!vulnerable.length){blog('🪵【滚木】护体生效，Boss攻击无法伤害你！','good');await sleep(250);return;}
 const target=vulnerable.reduce((a,b)=>a.hp<b.hp?a:b);
 if(!unit.bossEnraged&&unit.hp<=unit.maxHp*.5){
  unit.bossEnraged=true;unit.atk=Math.floor(unit.atk*1.25);unit.spd=Math.floor(unit.spd*1.15);
  blog('🔥 <b>'+unit.name+'</b> 进入狂暴状态！攻击与速度提升！','bad');
  showDamageFloat(unit.id,'狂暴！','crit');renderBattleUnits();await sleep(300);
 }
 unit.bossActionCount=(unit.bossActionCount||0)+1;
 const skill=unit.bossSkill;
 const useSkill=skill&&unit.bossActionCount%3===0;
 if(useSkill){
  const targets=skill.target==='all'?vulnerable:[target];
  blog('⚠️ <b>'+unit.name+'</b> 正在施展【'+skill.name+'】！','warn');
  await sleep(300);
  let total=0;
  targets.forEach(t=>{
   if(!t.alive)return;
   const {dmg,crit}=calcDamage(unit,t,skill.power,skill.type);
   t.hp=Math.max(0,t.hp-dmg);if(t.hp<=0)t.alive=false;
   if(t.isPlayer){battle.incomingRoundDamage=(battle.incomingRoundDamage||0)+dmg;}
   if(skill.effect==='stun'&&t.alive&&Math.random()<.45)t.stun=Math.max(t.stun||0,1);
   if(skill.effect==='slow'&&t.alive){t.spd=Math.max(1,Math.floor(t.spd*.85));t.bossSlowed=true;}
   shakeUnit(t.id);showDamageFloat(t.id,'-'+dmg,crit?'crit':'');total+=dmg;
   blog('💥【'+skill.name+'】命中 <b>'+t.name+'</b>，造成 <b>'+dmg+'</b> 点伤害'+(crit?'（暴击）':''),'bad');
   if(!t.alive)blog('☠️ <b>'+t.name+'</b> 倒下了！','bad');
  });
  if(skill.effect==='drain'){const heal=Math.min(unit.maxHp-unit.hp,Math.max(1,Math.floor(total*.35)));unit.hp+=heal;showDamageFloat(unit.id,'+'+heal,'heal');blog('🌿 古木汲取生命，恢复 '+heal+' 点气血！','good');}
  if(skill.effect==='burn')targets.filter(t=>t.alive).forEach(t=>{const burn=Math.max(1,Math.floor(unit.atk*.12));t.hp=Math.max(0,t.hp-burn);if(t.hp<=0)t.alive=false;if(t.isPlayer)battle.incomingRoundDamage+=burn;showDamageFloat(t.id,'灼烧 -'+burn,'');blog('🔥 烈焰持续灼烧 '+t.name+'，追加 '+burn+' 点伤害。','bad');});
 }else{
  const {dmg,crit}=calcDamage(unit,target,1,'phys');
  target.hp=Math.max(0,target.hp-dmg);if(target.hp<=0)target.alive=false;
  if(target.isPlayer)battle.incomingRoundDamage=(battle.incomingRoundDamage||0)+dmg;
  shakeUnit(target.id);showDamageFloat(target.id,'-'+dmg,crit?'crit':'');
  blog('👹 <b>'+unit.name+'</b> 发动重击，对 <b>'+target.name+'</b> 造成 <b>'+dmg+'</b> 点伤害'+(crit?'（暴击）':''),'bad');
  if(!target.alive)blog('☠️ <b>'+target.name+'</b> 倒下了！','bad');
 }
 renderBattleUnits();await sleep(400);
}

async function monsterTurn(unit){
  if(unit.isBoss){await bossTurn(unit);return;}
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  if (!allies.length) return;
  
  const vulnerable=allies.filter(a=>!(a.isPlayer&&a.invulnerableUntil>Date.now()));
  if(!vulnerable.length){blog('🪵【滚木】护体生效，敌方攻击无法伤害你！','good');await sleep(250);return;}
  const target = vulnerable.reduce((a, b) => a.hp < b.hp ? a : b);

    if(target.isPlayer) battle.incomingRoundDamage+=dmg;
    shakeUnit(target.id);
    showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');

/* ==================== 检查战斗结束 ==================== */
function checkBattleEnd(){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  
  if (enemies.length === 0){
    battle.over = true;
    battle.victory = true;
  } else if (allies.length === 0){
    battle.over = true;
    battle.victory = false;
  }
}

/* ==================== 战斗结算 ==================== */
function finishBattle(result){
  // 先解除战斗状态，确保结算界面出现后地图不会被旧状态锁死。
  battle.active = false;
  battle.over = true;
  
  const playerUnit = battle.units.find(u => u.isPlayer);
  const petUnit = battle.units.find(u => u.isPet);
  
  // 同步玩家状态
  if (playerUnit){
    P.hp = Math.max(1, playerUnit.hp);
    P.mp = playerUnit.mp;
  }
  if (petUnit && P.pet){
    P.pet.hp = Math.max(1, Math.floor(P.pet.maxHp * 0.2));
  }
  
  const duoDock = $('duoSkillDock');
  if (duoDock) duoDock.hidden = true;
  const banner = $('resultBanner');
  banner.innerHTML = '';
  
  if (result === 'flee' || battle.fled){
    banner.innerHTML = `
      <div class="rb-title win" style="color:#80d0ff;text-shadow:3px 3px 0 #000,0 0 30px rgba(128,208,255,.9)">脱 离</div>
      <div class="rb-info">你成功脱离了战斗</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (result === 'draw'){
    banner.innerHTML = `
      <div class="rb-title" style="color:#c0a0e8">平 局</div>
      <div class="rb-info">战斗超时，双方各自收手</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (battle.victory){
    // 计算奖励
    let exp = 0, gold = 0;
    battle.units.filter(u => u.isEnemy).forEach(m => {
      exp += m.exp || 30;
      gold += m.gold || 15;
    });
    
    // 加成
    const bonus = 1 + P.lv * 0.05;
    exp = Math.floor(exp * bonus);
    gold = Math.floor(gold * bonus);
    
    P.gold += gold;
    P.battles++;
    P.kills = (P.kills || 0) + battle.units.filter(u => u.isEnemy && !u.alive).length;
    if (!P.killStats || typeof P.killStats !== 'object') P.killStats = {};
    const bossLoot=[];
    battle.units.filter(u=>u.isEnemy&&!u.alive).forEach(u=>{
      P.killStats[u.mobId||u.name]=(P.killStats[u.mobId||u.name]||0)+1;
      if(u.mobId&&u.mobId.startsWith('boss_')){
        if(!P.bossDrops[u.mobId]){const book=CULTIVATION_BOOKS.find(x=>x.boss===u.mobId);if(book){P.cultivationBooks.push(book.id);P.bossDrops[u.mobId]=true;bossLoot.push({type:'功法',name:book.name,icon:'📜',quality:'珍稀'});toast('Boss掉落功法：'+book.name);addLog('获得功法 '+book.name,'good');}}
        const gear=grantBossGear(u.mobId);if(gear){bossLoot.push({type:'专属装备',name:gear.name,icon:gear.icon,quality:getGearQuality(gear)});toast('Boss掉落'+getGearQuality(gear)+'装备：'+gear.name);}
      }
    });
    gainExp(exp);
    if(P.pet)gainPetExp(Math.max(10,Math.floor(exp*.35)));
    rollPetCaptureOffer();
    const petGearLoot=rollPetGearDrop();if(petGearLoot)toast('🐾 召唤兽装备掉落：'+petGearLoot.name+'！');
    
    banner.innerHTML = `
      <div class="rb-title win">胜 利</div>
      <div class="rb-info">
        获得经验 <b>+${fmt(exp)}</b><br>
        获得银两 <b>+${fmt(gold)}</b>
        ${bossLoot.length?'<div class="rb-loot-title">🎁 战利品</div>'+bossLoot.map(x=>'<div class="rb-loot-item"><span>'+x.icon+' '+x.name+'</span><small>'+x.quality+' '+x.type+'</small></div>').join(''):''}
      </div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
    
    addLog(`【战斗】胜利！经验 +${exp}，银两 +${gold}`, 'good');
  } else {
    const lost = Math.floor(P.gold * 0.1);
    P.gold = Math.max(0, P.gold - lost);
    P.hp = Math.max(1, Math.floor(P.maxHp * 0.25));
    P.mp = Math.max(0, Math.floor(P.maxMp * 0.3));
    
    banner.innerHTML = `
      <div class="rb-title lose">战 败</div>

function renderBuyList(list){
  // 商店出售的药品
  const buyables = ['hp1', 'hp2', 'hp3', 'mp1', 'mp2', 'exp1', 'exp2', 'stone1', 'stone2', 'stone3'];
  
  buyables.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    const rare = it.rare || 0;
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}</div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#ffd060">${fmt(it.price)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '购买';
    btn.disabled = P.gold < it.price;
    btn.addEventListener('click', () => {
      if (P.gold < it.price) return;
      // 检查背包空间
      const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
      if (keys.length >= 20 && !P.bag[id]){
        toast('背包已满');
        return;
      }
      P.gold -= it.price;
      P.bag[id] = (P.bag[id] || 0) + 1;
      toast(`🛒 购入 ${it.icon}${it.name}`);
      addLog(`【购买】${it.name} 花费 ${it.price} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

function renderSellList(list){
  const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
  
  if (!keys.length){
    list.innerHTML = '<div class="empty-tip"><span class="ei">🎒</span>背包中没有可出售的物品</div>';
    return;
  }
  
  keys.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    // 出售价为原价 50%
    const sellPrice = Math.floor((it.price || 0) * 0.5);
    const rare = it.rare || 0;
    
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}<span class="li-count">×${P.bag[id]}</span></div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#80ffa0">+${fmt(sellPrice)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '出售';
    btn.disabled = sellPrice <= 0;
    btn.addEventListener('click', () => {
      if (sellPrice <= 0) return;
      P.gold += sellPrice;
      P.bag[id]--;
      if (P.bag[id] <= 0) delete P.bag[id];
      toast(`💰 出售 ${it.icon}${it.name}，获得 ${sellPrice} 两`);
      addLog(`【出售】${it.name} 获得 ${sellPrice} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

const SAVE_KEY = 'mhxy_single_player_save_v1';
let gameLoopTimer = null;
let cultivationTimer=null,immortalTimer=null;

/* 保存游戏 */
function saveGame(){
  try{
    const data = getSaveData();
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(err){
    console.warn('保存游戏失败：', err);
    return false;
  }
}

function getSaveData(){
  return {
    name:P.name, sect:P.sect, avatar:P.avatar, lv:P.lv, exp:P.exp,
    hp:P.hp, maxHp:P.maxHp, mp:P.mp, maxMp:P.maxMp,
    atk:P.atk, def:P.def, spd:P.spd, magic:P.magic,
    gold:P.gold, x:P.x, y:P.y, scene:P.scene, subScene:P.subScene,
    bag:P.bag, pet:P.pet, petBox:P.petBox, petCaptureOffer:P.petCaptureOffer, petGearInventory:P.petGearInventory, petGearEquipped:P.petGearEquipped, steps:P.steps, lastEncounterStep:P.lastEncounterStep, teleportStones:P.teleportStones, equipment:P.equipment, gearInventory:P.gearInventory, gearCodex:P.gearCodex, gearSetApplied:P.gearSetApplied, cultivationBooks:P.cultivationBooks, cultivationActive:P.cultivationActive, cultivationProgressMs:P.cultivationProgressMs, bossDrops:P.bossDrops, bossGearDrops:P.bossGearDrops, laomuCooldownUntil:P.laomuCooldownUntil, flags:P.flags, discoveredRegions:P.discoveredRegions,
    battles:P.battles, kills:P.kills, killStats:P.killStats, bankGold:P.bankGold,
    immortalRealm:serializeImmortalRealm(),
    logs:Array.isArray(P.logs) ? P.logs.slice(-50) : []
  };
}

function applySaveData(data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return false;

  const allowed = [
    'name','sect','avatar','lv','exp','hp','maxHp','mp','maxMp',
    'atk','def','spd','magic','gold','x','y','scene','subScene',
    'bag','pet','petBox','petCaptureOffer','petGearInventory','petGearEquipped','steps','lastEncounterStep','teleportStones','battles','kills','killStats','bankGold','equipment','gearInventory','gearCodex','gearSetApplied','logs','cultivationBooks','cultivationActive','cultivationProgressMs','bossDrops','bossGearDrops','laomuCooldownUntil','flags','discoveredRegions','immortalRealm'
  ];
  if(!Object.prototype.hasOwnProperty.call(data,'gearCodex'))P.gearCodex={};
  if(!Object.prototype.hasOwnProperty.call(data,'gearSetApplied'))P.gearSetApplied={};
  allowed.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(data, key)) P[key] = data[key];
  });
  P.avatar = P.avatar === 'frog' ? 'frog' : 'original';

  /* 防止旧存档或手工修改造成非法数值 */
  P.lv = Math.max(1, Number(P.lv) || 1);
  P.exp = Math.max(0, Number(P.exp) || 0);
  P.maxHp = Math.max(1, Number(P.maxHp) || 100);
  P.maxMp = Math.max(1, Number(P.maxMp) || 50);
  P.hp = clamp(Number(P.hp) || P.maxHp, 0, P.maxHp);
  P.mp = clamp(Number(P.mp) || P.maxMp, 0, P.maxMp);
  P.gold = Math.max(0, Number(P.gold) || 0);
  P.x = Number.isFinite(Number(P.x)) ? Number(P.x) : 0;
  P.y = Number.isFinite(Number(P.y)) ? Number(P.y) : 0;
  P.steps = Math.max(0, Number(P.steps) || 0);
  P.lastEncounterStep=Number.isFinite(Number(P.lastEncounterStep))?Math.max(0,Math.floor(Number(P.lastEncounterStep))):Math.max(0,P.steps-14);
  P.battles = Math.max(0, Number(P.battles) || 0);
  P.kills = Math.max(0, Number(P.kills) || 0);
  P.bankGold = Math.max(0, Number(P.bankGold) || 0);
  if (!P.killStats || typeof P.killStats !== 'object') P.killStats = {};
  if (!P.bag || typeof P.bag !== 'object') P.bag = {};
  if (!P.equipment || typeof P.equipment !== 'object') P.equipment={weapon:null,armor:null,helmet:null,boots:null,accessory:null};
  ['weapon','armor','helmet','boots','accessory'].forEach(k=>{if(!Object.prototype.hasOwnProperty.call(P.equipment,k))P.equipment[k]=null;});
  if (!Array.isArray(P.gearInventory)) P.gearInventory=[];
  P.gearInventory=P.gearInventory.filter(g=>g&&typeof g.id==='string'&&GEAR_CATALOG[g.id]&&Number.isFinite(Number(g.level))).map(g=>({id:g.id,level:Math.max(0,Math.min(5,Math.floor(Number(g.level)||0)))}));
  if(!P.gearCodex||typeof P.gearCodex!=='object')P.gearCodex={};
  P.gearCodex=Object.fromEntries(Object.entries(P.gearCodex).filter(([id,v])=>GEAR_CATALOG[id]&&v===true));
  P.gearInventory.forEach(g=>P.gearCodex[g.id]=true);
  if(!P.gearSetApplied||typeof P.gearSetApplied!=='object')P.gearSetApplied={};
  P.gearSetApplied=Object.fromEntries(Object.entries(P.gearSetApplied).filter(([k,v])=>['atk','def','spd','magic','hp','mp'].includes(k)&&Number.isFinite(Number(v))&&Math.abs(Number(v))<=1000).map(([k,v])=>[k,Number(v)]));
  if (!Array.isArray(P.petBox)) P.petBox = [];
  P.pet=normalizePetRecord(P.pet);
  P.petBox=P.petBox.map(normalizePetRecord).filter(Boolean).slice(0,6);
  normalizePetGear();
  if(!P.bag||typeof P.bag!=='object')P.bag={};
  P.bag.petSeal=Math.max(0,Math.floor(Number(P.bag.petSeal)||0));
  if(P.petCaptureOffer&&(!PETS.some(x=>x.id===P.petCaptureOffer.id)||!Number.isFinite(Number(P.petCaptureOffer.enemyLv))))P.petCaptureOffer=null;
  if (!Array.isArray(P.discoveredRegions)) P.discoveredRegions=['changan','jiangnan','datang','beiju','huoyan'];
  P.discoveredRegions=Array.from(new Set(P.discoveredRegions.filter(id=>SCENES.some(scene=>scene.id===id))));
  if(!Array.isArray(data.teleportStones))P.teleportStones=P.discoveredRegions.slice();
  P.teleportStones=Array.from(new Set(P.teleportStones.filter(id=>SCENES.some(scene=>scene.id===id))));
  const currentScene=getSceneAt(P.x,P.y);if(currentScene&&!P.teleportStones.includes(currentScene.id))P.teleportStones.push(currentScene.id);
  ['changan','jiangnan','datang','beiju','huoyan'].forEach(id=>{if(!P.discoveredRegions.includes(id))P.discoveredRegions.push(id);});
  if (!Array.isArray(P.logs)) P.logs = [];
  if (!Array.isArray(P.cultivationBooks)) P.cultivationBooks=[];
  if (!P.bossDrops || typeof P.bossDrops!=='object') P.bossDrops={};
  if (!P.bossGearDrops || typeof P.bossGearDrops!=='object') P.bossGearDrops={};
  if (!P.flags || typeof P.flags!=='object') P.flags={};
  P.immortalRealm=normalizeImmortalRealm(data.immortalRealm);
  P.cultivationProgressMs=Math.max(0,Number(P.cultivationProgressMs)||0);
  P.laomuCooldownUntil=Math.max(0,Number(P.laomuCooldownUntil)||0);
  syncGearSetBonuses();

  return Boolean(P.sect);
}

/* 读取存档 */
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    return applySaveData(data);
  }catch(err){
    console.warn('读取存档失败：', err);
    return false;
  }
}

/* 清除存档 */
function clearSave(){
  try{
    localStorage.removeItem(SAVE_KEY);
    return true;
  }catch(err){
    console.warn('清除存档失败：', err);
    return false;
  }
}

/* 游戏主循环：负责定时刷新 HUD，并自动保存 */
function startGameLoop(){
  if (gameLoopTimer) clearInterval(gameLoopTimer);
  if(cultivationTimer)clearInterval(cultivationTimer);cultivationTimer=setInterval(tickCultivation,1000);if(immortalTimer)clearInterval(immortalTimer);immortalTimer=setInterval(tickImmortalRealm,1000);

  updateHUD();
  renderWorld();

  gameLoopTimer = setInterval(() => {
    if (battle && battle.active) return;

    /* 非战斗状态下缓慢恢复，避免数值溢出 */
    if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + 1);
    if (P.mp < P.maxMp) P.mp = Math.min(P.maxMp, P.mp + 1);

    updateHUD();
    saveGame();
  }, 5000);

  saveGame();
}

function initGame(){
  const hasSave = loadGame();

  updateHUD();

  if (hasSave && P.sect && SECTS.some(s => s.id === P.sect)){
    $('modalSect').classList.remove('show');
    renderWorld();
    startGameLoop();
    toast('💾 已读取上次游戏进度');
    return;
  }

  /* 没有有效存档时进入门派选择 */
  P.sect = null;
  renderSectSelect();
  $('modalSect').classList.add('show');
}

const DEV_FEATURE_TESTS=[],DEV_TEST_HISTORY=[];
function registerFeatureTest(name,category,checks){
 if(!name||!Array.isArray(checks)||!checks.length)throw new Error('功能测试注册参数无效');
 if(DEV_FEATURE_TESTS.some(x=>x.name===name))throw new Error('重复注册功能测试：'+name);
 DEV_FEATURE_TESTS.push({name:String(name),category:String(category||'其他'),checks:checks.map((x,i)=>({name:String(x.name||('检查 '+(i+1))),run:x.run}))});
 if(typeof renderDeveloperPanel==='function'&&$('modalDeveloper')?.classList.contains('show'))renderDeveloperPanel();
}
function runDeveloperFeature(feature){
 const results=[];(feature.checks||[]).forEach(check=>{let ok=false,detail='';try{const value=check.run();ok=value!==false;detail=typeof value==='string'?value:(ok?'检查通过':'检查返回 false');}catch(err){detail=err&&err.message?err.message:String(err);}results.push({feature:feature.name,name:check.name,ok,detail,time:Date.now()});});
 DEV_TEST_HISTORY.unshift(...results);DEV_TEST_HISTORY.splice(200);return results;
}
function escapeDevText(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}

function normalizeImmortalRealm(data){
 const d=data&&typeof data==='object'&&!Array.isArray(data)?data:{},base=createImmortalRealmState(),m=d.mansion&&typeof d.mansion==='object'?d.mansion:{},mat=d.materials&&typeof d.materials==='object'?d.materials:{};
 const num=(v,def,min,max)=>{const n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):def;};
 return {unlocked:d.unlocked===true,stageIndex:Math.floor(num(d.stageIndex,0,0,8)),dao:num(d.dao,0,0,1e12),qi:num(d.qi,0,0,1e12),jade:num(d.jade,0,0,1e12),body:num(d.body,100,1,1e9),spirit:num(d.spirit,100,1,1e9),trialStep:Math.floor(num(d.trialStep,0,0,3)),onlineSeconds:Math.floor(num(d.onlineSeconds,0,0,1e12)),notice:typeof d.notice==='string'?d.notice.slice(0,180):base.notice,activeTab:['mansion','sect','travel'].includes(d.activeTab)?d.activeTab:'mansion',view:'mortal',sect:IMMORTAL_SECTS.some(x=>x.id===d.sect)?d.sect:null,techniques:Array.isArray(d.techniques)?d.techniques.filter(id=>IMMORTAL_TECHNIQUES.some(x=>x.id===id)).slice(0,30):[],artifacts:Array.isArray(d.artifacts)?d.artifacts.filter(id=>IMMORTAL_ARTIFACTS.some(x=>x.id===id)).slice(0,30):[],materials:{starSand:num(mat.starSand,0,0,1e9),swordShard:num(mat.swordShard,0,0,1e9),chaosShard:num(mat.chaosShard,0,0,1e9),voidCrystal:num(mat.voidCrystal,0,0,1e9),immortalHerb:num(mat.immortalHerb,0,0,1e9)},mansion:{arrayLevel:Math.floor(num(m.arrayLevel,0,0,10)),fieldLevel:Math.floor(num(m.fieldLevel,0,0,10)),puppetLevel:Math.floor(num(m.puppetLevel,0,0,10)),fieldPlanted:m.fieldPlanted===true,fieldProgress:Math.floor(num(m.fieldProgress,0,0,60)),herbs:Math.floor(num(m.herbs,0,0,1e9))}};

function immortalStageName(){return IMMORTAL_STAGES[P.immortalRealm.stageIndex]||IMMORTAL_STAGES[0];}

 const r=P.immortalRealm||createImmortalRealmState(),inside=!!(r.unlocked&&r.view==='immortal'),top=$('topbar'),mortal=$('stage'),immortal=$('immortalStage');
 if(top)top.style.display=inside?'none':'';if(mortal)mortal.style.display=inside?'none':'';if(immortal)immortal.style.display=inside?'flex':'none';

function upgradeImmortalFacility(type){
 const r=P.immortalRealm,m=r.mansion,keys={array:'arrayLevel',field:'fieldLevel',puppet:'puppetLevel'},key=keys[type];if(!key)return false;const level=m[key];if(level>=10)return false;
 const cost=(type==='array'?40:type==='field'?30:50)*Math.pow(level+1,2);if(r.jade<cost){immortalMessage('仙玉不足，需要 '+cost+' 仙玉');return false;}r.jade-=cost;m[key]++;immortalMessage(({array:'聚仙阵',field:'仙田',puppet:'仙傀'})[type]+'提升至 Lv.'+m[key]);saveGame();renderImmortalRealm('mansion');return true;

/* 响应式重绘：设备旋转、浏览器地址栏收起/展开、窗口尺寸变化时重新计算地图 */
(function responsiveLayout(){
  let raf = 0;
  function refreshLayout(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      document.documentElement.style.setProperty('--vw', `${window.innerWidth}px`);
      document.documentElement.style.setProperty('--vh', `${window.innerHeight}px`);
      if (typeof P !== 'undefined' && P.sect && typeof renderWorld === 'function') {
        renderWorld();
      }
    });
  }
  window.addEventListener('resize', refreshLayout, {passive:true});
  window.addEventListener('orientationchange', () => setTimeout(refreshLayout, 120), {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', refreshLayout, {passive:true});
  }
  refreshLayout();
})();


/* ================= 最终屏幕尺寸同步 ================= */
(function(){
  let resizeTimer = 0;
  function syncViewport(){
    document.documentElement.style.setProperty('--vw', window.innerWidth + 'px');
    document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
    const g = document.getElementById('game');
    if (g){
      g.style.width = '100vw';
      g.style.maxWidth = '100vw';
      g.style.height = '100dvh';
    }
    if (typeof renderWorld === 'function') renderWorld();
  }
  function schedule(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncViewport, 80);
  }
  window.addEventListener('resize', schedule, {passive:true});
  window.addEventListener('orientationchange', schedule, {passive:true});
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', schedule, {passive:true});
  }
  syncViewport();
})();

   - 钱庄存取
   - 任务按真实击杀数统计
   - 场景坐标/区域状态同步
   - 技能面板重复渲染修复
   - 召唤兽仓库/切换
   ============================================================ */

(function installCompletionFeatures(){

  /* ---------- 场景状态同步 ---------- */
  const _updateSceneTitle = updateSceneTitle;
  updateSceneTitle = function(){
    _updateSceneTitle();
    const scene = getSceneAt(P.x, P.y);
    if (isTown(P.x, P.y)){
      P.scene = '长安城';
      P.subScene = Math.hypot(P.x, P.y) < 4.5 ? '中心广场' : '城内街区';
    } else if (scene){
      P.scene = scene.name;
      P.subScene = '野外区域';
    } else {
      P.scene = '荒野';
      P.subScene = '无主之地';
    }
  };

  /* ---------- 任务：按真实击杀数显示进度 ---------- */
  function getQuestProgress(q){
    if (q.id === 'q1'){
      return Math.min(
        (P.killStats?.lang || 0) + (P.killStats?.shanzei || 0),
        q.target
      );
    }
    return Math.min(P.kills || 0, q.target);
  }

  renderTaskPanel = function(){
    const body = $('taskBody');
    let html = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div class="stat-box gold">
          <span class="sk"><span class="ski">⚔️</span>累计击杀</span>
          <span class="sv">${P.kills || 0}</span>
        </div>
        <div class="stat-box">
          <span class="sk"><span class="ski">🏁</span>完成任务</span>
          <span class="sv">${P.questDone || 0}</span>
        </div>
      </div>
      <div class="section-title"><span class="sti">📜</span>江湖任务</div>
    `;
    body.innerHTML = html;

    QUESTS.forEach(q => {
      const done = !!P.flags[q.id];
      const cur = getQuestProgress(q);
      const pct = clamp(cur / q.target * 100, 0, 100);

      const it = document.createElement('div');
      it.className = 'list-item';
      if (done) it.classList.add('rare-3');

      it.innerHTML = `
        <div class="li-icon" style="font-size:22px">${q.icon}</div>
        <div class="li-body">
          <div class="li-name">
            ${q.name}
            ${done ? '<span style="font-size:10px;color:#80ffa0;margin-left:5px;font-weight:normal">✓ 已完成</span>' : ''}
          </div>
          <div class="li-desc">${q.desc}</div>
          <div style="margin-top:5px;height:8px;background:#180c04;border:1px solid #060302;border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)">
            <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#906010,#e0a820,#ffe070);transition:width .3s"></div>
          </div>
          <div style="margin-top:4px;font-size:10px;color:#c0a870">
            进度 <b style="color:#ffe8a0">${cur}</b> / ${q.target}
            · 奖励 <span style="color:#ffd060">💰${q.reward.gold}</span>
            <span style="color:#f0c860">⭐${q.reward.exp}</span>
          </div>
        </div>
      `;

      if (!done && cur >= q.target){
        const btn = document.createElement('button');
        btn.className = 'li-btn';
        btn.textContent = '领取';
        btn.addEventListener('click', () => {
          P.flags[q.id] = true;
          P.questDone = (P.questDone || 0) + 1;
          P.gold += q.reward.gold;
          gainExp(q.reward.exp);
          toast(`🎉 完成【${q.name}】！+${q.reward.gold}两 +${q.reward.exp}经验`);
          addLog(`【任务】完成 ${q.name}`, 'good');
          updateHUD();
          saveGame();
          renderTaskPanel();
        });
        it.appendChild(btn);
      } else if (done){
        const tag = document.createElement('div');
        tag.className = 'li-right';
        tag.style.color = '#80ffa0';
        tag.textContent = '已领';
        it.appendChild(tag);
      }

      body.appendChild(it);
    });
  };

  /* ---------- 技能面板：每次打开先清空，避免越点越多 ---------- */
  openSkillPanel = function(){
    const body = $('skillBody');
    const sect = SECTS.find(s => s.id === P.sect);
    body.innerHTML = '';

    if (!sect){
      body.innerHTML = '<div class="empty-tip"><span class="ei">✨</span>尚未拜入任何门派</div>';
      openModal('modalSkill');
      return;
    }

    body.innerHTML = `
      <div style="text-align:center;margin-bottom:12px;padding:10px;background:linear-gradient(180deg,${sect.color}22,transparent);border:1.5px solid ${sect.color}55;border-radius:8px">
        <div style="font-size:22px">${sect.icon}</div>
        <div style="font-size:14px;color:${sect.color};font-weight:bold;letter-spacing:2px;margin-top:4px">${sect.name}</div>
        <div style="font-size:10.5px;color:#c0a870;margin-top:4px">${sect.longDesc}</div>
      </div>
      <div class="section-title"><span class="sti">✨</span>门派技能</div>
    `;

    sect.skills.forEach(sk => {
      const learned = sk.lv <= P.lv;
      const it = document.createElement('div');
      it.className = 'list-item';
      if (!learned){
        it.style.opacity = '0.45';
        it.style.filter = 'grayscale(.5)';
      } else if (sk.type === 'magic') it.classList.add('rare-1');
      else if (sk.type === 'heal') it.classList.add('rare-2');
      else if (sk.power >= 3) it.classList.add('rare-3');

      const typeIcon = sk.type === 'magic' ? '🔮' : sk.type === 'phys' ? '⚔️' : sk.type === 'heal' ? '💚' : '🔒';
      const typeName = sk.type === 'magic' ? '法术' : sk.type === 'phys' ? '物理' : sk.type === 'heal' ? '治疗' : '封印';

      it.innerHTML = `
        <div class="li-icon" style="font-size:20px">${learned ? typeIcon : '🔒'}</div>
        <div class="li-body">
          <div class="li-name" style="color:${learned ? (sk.type === 'magic' ? '#80c0ff' : sk.type === 'heal' ? '#80ffa0' : '#ffe8a0') : '#8a7050'}">
            ${sk.name}
            ${learned ? '' : `<span style="font-size:9.5px;color:#c08060;margin-left:5px">Lv.${sk.lv} 解锁</span>`}
          </div>
          <div class="li-desc">${sk.desc}</div>
          <div style="margin-top:4px;font-size:9.5px;color:#c0a870">
            <span style="color:#80d0ff">【${typeName}】</span>
            ${sk.target === 'all' ? ' 群体' : ' 单体'}
          </div>
        </div>
        <div class="li-right" style="color:#80c0ff">${sk.mp}<small>法力</small></div>
      `;
      body.appendChild(it);
    });

    const statTip = document.createElement('div');
    statTip.style.cssText = 'margin-top:12px;padding:10px;background:linear-gradient(180deg,rgba(240,200,96,.08),transparent);border:1.5px solid rgba(240,200,96,.25);border-radius:6px;font-size:10.5px;color:#c0a870;line-height:1.7';
    statTip.innerHTML = `
      <div style="color:#ffe8a0;font-weight:bold;letter-spacing:2px;margin-bottom:5px">📊 门派成长</div>
      每级成长：气血 +${Math.floor(sect.grow.hp)} · 法力 +${Math.floor(sect.grow.mp)} · 攻击 +${Math.floor(sect.grow.atk)} · 防御 +${Math.floor(sect.grow.def)} · 速度 +${Math.floor(sect.grow.spd)} · 灵力 +${Math.floor(sect.grow.magic)}
    `;
    body.appendChild(statTip);
    openModal('modalSkill');
  };

  /* ---------- 真正的小地图 ---------- */
  openMiniMap = function(){
    let modal = $('modalWorldMap');
    if (!modal){
      modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'modalWorldMap';
      modal.innerHTML = `
        <div class="dialog" style="max-width:520px">
          <div class="dialog-head">
            <div class="dialog-title">世 界 地 图</div>
            <button class="dialog-close" data-close="modalWorldMap">✕</button>
          </div>
          <div class="dialog-body" id="worldMapBody"></div>
          <div class="dialog-foot">
            <button class="btn primary" id="worldMapClose">返 回 游 戏</button>
          </div>
        </div>
      `;
      $('game').appendChild(modal);
      const closeWorldMap=()=>{modal.classList.remove('show');const control=$('miniMapControl');if(control)control.classList.remove('map-open');};
      modal.addEventListener('click',e=>{if(e.target===modal)closeWorldMap();});
      modal.querySelector('[data-close]').addEventListener('click',closeWorldMap);
      modal.querySelector('#worldMapClose').addEventListener('click',closeWorldMap);
    }

    const body=$('worldMapBody');
    // 地面坐标比例 1:5：每个地面坐标单位绘制为 5px。
    const minX=-150,maxX=150,minY=-130,maxY=150,scale=5;
    const mapW=(maxX-minX)*scale,mapH=(maxY-minY)*scale,sx=scale,sy=scale;
    let html=`<div style="max-height:56vh;overflow:auto;border:2px solid #8a6428;border-radius:8px;background:#142719;-webkit-overflow-scrolling:touch"><div id="worldMapCanvas" style="position:relative;width:${mapW}px;height:${mapH}px;overflow:hidden;background-color:#284d30;background-image:linear-gradient(rgba(220,230,160,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(220,230,160,.09) 1px,transparent 1px),radial-gradient(ellipse at 50% 48%,#527b42 0%,#315d38 48%,#193923 100%);background-size:25px 25px,25px 25px,100% 100%"><div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 124px,rgba(240,220,150,.16) 124px 125px),repeating-linear-gradient(90deg,transparent 0 124px,rgba(240,220,150,.16) 124px 125px);pointer-events:none"></div>`;
    SCENES.forEach(s=>{
      const x=(s.cx-minX)*sx,y=(s.cy-minY)*sy,w=s.radius*2*sx,h=s.radius*2*sy;
      const discovered=!s.hidden||(Array.isArray(P.discoveredRegions)&&P.discoveredRegions.includes(s.id));
      const emoji=!discovered?'❔':s.biome==='town'?'🏰':s.biome==='plain'?'🌾':s.biome==='desert'?'🏜️':s.biome==='snow'?'❄️':s.biome==='coast'?'🌊':s.biome==='forest'?'🌲':'🌋';
      const bossInfo=discovered&&SCENE_BOSSES[s.id]?getSceneBossAt(Math.round(s.cx),Math.round(s.cy)):null;
      const regionLabel=discovered?s.name:'未知区域';
      html+=`<div title="${regionLabel}" style="position:absolute;left:${x-w/2}px;top:${y-h/2}px;width:${w}px;height:${h}px;border:2px solid rgba(255,220,120,.42);border-radius:50%;background:rgba(240,200,96,.10);display:flex;align-items:center;justify-content:center"><span style="font-size:30px">${emoji}</span><span style="position:absolute;bottom:5px;white-space:nowrap;font-size:13px;color:#ffe8a0">${regionLabel}</span></div>`;
      if(bossInfo){const bx=(Math.round(s.cx)-minX)*sx,by=(Math.round(s.cy)-minY)*sy;
        html+=`<div title="${bossInfo.name} 坐标 (${Math.round(s.cx)}, ${Math.round(s.cy)})" style="position:absolute;left:${bx-10}px;top:${by-10}px;width:20px;height:20px;border:2px solid #fff0a0;border-radius:50%;background:#a51e25;box-shadow:0 0 0 4px rgba(255,190,55,.35),0 0 16px #ff6b35;z-index:6;display:flex;align-items:center;justify-content:center">👑</div><div style="position:absolute;left:${bx+14}px;top:${by-13}px;padding:4px 6px;border:1px solid #ffd45c;border-radius:5px;background:rgba(45,12,8,.94);color:#fff0b0;font-size:11px;line-height:1.35;white-space:nowrap;z-index:7">${bossInfo.name} Lv.${bossInfo.lv}<br><span style="color:#9de2a6">坐标 (${Math.round(s.cx)}, ${Math.round(s.cy)})</span></div>`;
      }
    });
    const px=(P.x-minX)*sx,py=(P.y-minY)*sy;
    html+=`<div style="position:absolute;right:12px;top:12px;padding:6px 9px;background:rgba(20,10,4,.92);border:1px solid rgba(240,200,96,.6);border-radius:5px;color:#ffe8a0;font-size:12px;z-index:11">已探索区域：${(P.discoveredRegions||[]).length} / ${SCENES.length}</div><div title="玩家当前位置 (${P.x}, ${P.y})" style="position:absolute;left:${px-8}px;top:${py-8}px;width:16px;height:16px;border:3px solid #fff;border-radius:50%;background:#ff5040;box-shadow:0 0 0 4px rgba(255,80,64,.3),0 0 14px #ff5040;z-index:10"></div><div style="position:absolute;left:12px;top:12px;padding:6px 9px;background:rgba(35,8,8,.92);border:1px solid #ffd45c;border-radius:5px;color:#ffe8a0;font-size:12px;z-index:11">👑 Boss 位置 · 比例 1:5</div><div style="position:absolute;left:12px;bottom:12px;padding:6px 9px;background:rgba(20,10,4,.92);border:1px solid rgba(240,200,96,.6);border-radius:5px;color:#ffe8a0;font-size:12px;z-index:11">玩家坐标 X:${P.x} · Y:${P.y}</div></div></div>`;
    body.innerHTML=html;modal.classList.add('show');
    const control=$('miniMapControl');if(control)control.classList.add('map-open');
    const scroller=body.firstElementChild;requestAnimationFrame(()=>{if(scroller){scroller.scrollLeft=Math.max(0,px-scroller.clientWidth/2);scroller.scrollTop=Math.max(0,py-scroller.clientHeight/2);}});

  };

  /* ---------- 钱庄：原界面已有“钱庄”图标，现在真正可用 ---------- */
  TILE_ICON['build-shop'].action = 'openBank';

  window.openBankPanel = function(){
    let modal = $('modalBank');
    if (!modal){
      modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'modalBank';
      modal.innerHTML = `
        <div class="dialog">
          <div class="dialog-head">
            <div class="dialog-title">钱 庄</div>
            <button class="dialog-close" data-close="modalBank">✕</button>
          </div>
          <div class="dialog-body" id="bankBody"></div>
          <div class="dialog-foot">
            <button class="btn primary" data-close="modalBank">离 开</button>
          </div>
        </div>
      `;
      $('game').appendChild(modal);
    }

    const body = $('bankBody');
    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box gold"><span class="sk"><span class="ski">💰</span>身上银两</span><span class="sv">${fmt(P.gold)}</span></div>
        <div class="stat-box"><span class="sk"><span class="ski">🏦</span>钱庄存款</span><span class="sv">${fmt(P.bankGold)}</span></div>
      </div>
      <div class="section-title"><span class="sti">🏦</span>存取银两</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
        <button class="btn primary" id="bankDeposit100">存 100 两</button>
        <button class="btn primary" id="bankDepositAll">全部存入</button>
        <button class="btn" id="bankWithdraw100">取 100 两</button>
        <button class="btn" id="bankWithdrawAll">全部取出</button>
      </div>
    `;

    const refresh = () => openBankPanel();
    $('bankDeposit100').onclick = () => {
      if (P.gold < 100){ toast('银两不足'); return; }
      P.gold -= 100; P.bankGold += 100; saveGame(); updateHUD(); refresh();
    };
    $('bankDepositAll').onclick = () => {
      if (P.gold <= 0){ toast('身上没有银两'); return; }
      P.bankGold += P.gold; P.gold = 0; saveGame(); updateHUD(); refresh();
    };
    $('bankWithdraw100').onclick = () => {
      if (P.bankGold < 100){ toast('钱庄余额不足'); return; }
      P.bankGold -= 100; P.gold += 100; saveGame(); updateHUD(); refresh();
    };
    $('bankWithdrawAll').onclick = () => {
      if (P.bankGold <= 0){ toast('钱庄没有存款'); return; }
      P.gold += P.bankGold; P.bankGold = 0; saveGame(); updateHUD(); refresh();
    };

    modal.classList.add('show');
  };

  /* ---------- 瓦片交互：增加钱庄 ---------- */
  const _onTileClick = onTileClick;
  onTileClick = function(wx, wy, tile){
    const info = TILE_ICON[tile];
    if (info && info.action === 'openBank'){
      const dist = Math.hypot(wx - P.x, wy - P.y);
      if (dist > 2.2){ toast('距离太远，请靠近一些'); return; }
      openBankPanel();
      return;
    }
    _onTileClick(wx, wy, tile);
  };

  /* ---------- 地图怪物点击：从“只是显示”变成可直接挑战 ---------- */
  if (!world.dataset.monsterClickBound){
    world.dataset.monsterClickBound = '1';
    world.addEventListener('click', e => {
      const mobEl = e.target.closest('.map-monster');
      if (!mobEl) return;
      const tileEl = mobEl.closest('.tile');
      if (!tileEl) return;
      const left = parseFloat(tileEl.style.left) || 0;
      const top = parseFloat(tileEl.style.top) || 0;
      const wx = P.x + Math.round((left + TILE / 2 - stage.clientWidth / 2) / TILE);
      const wy = P.y + Math.round((top + TILE / 2 - stage.clientHeight / 2) / TILE);
      const mob = getMapMonster(wx, wy);
      if (!mob || isTown(wx, wy)) return;
      e.preventDefault();
      e.stopPropagation();
      const clone = JSON.parse(JSON.stringify(mob));
      clone.maxHp = clone.hp;
      battlePrepare([clone]);
    });
  }

  /* ---------- 召唤兽仓库：保留已有 petBox 数据并允许收纳/切换 ---------- */
  const oldRenderPetPanel = renderPetPanel;
  renderPetPanel = function(){
    oldRenderPetPanel();

    const body = $('petBody');
    if (!body || body.querySelector('#petStorage')) return;

    const storage = document.createElement('div');
    storage.id = 'petStorage';
    storage.style.cssText = 'margin-top:14px;padding:10px;border:1.5px solid rgba(240,200,96,.25);border-radius:7px;background:rgba(0,0,0,.12)';
    storage.innerHTML = `
      <div style="color:#ffe8a0;font-weight:bold;letter-spacing:2px;margin-bottom:7px">📦 召唤兽仓库</div>
      <div style="font-size:10px;color:#c0a870;margin-bottom:8px">已存放 ${P.petBox.length} / 6 只</div>
      <div id="petStorageList"></div>
    `;

    const list = storage.querySelector('#petStorageList');

    if (P.pet){
      const storeBtn = document.createElement('button');
      storeBtn.className = 'btn small';
      storeBtn.style.width = '100%';
      storeBtn.textContent = '📥 将当前召唤兽收进仓库';
      storeBtn.disabled = P.petBox.length >= 6;
      storeBtn.onclick = () => {
        if (!P.pet || P.petBox.length >= 6) return;
        P.petBox.push(P.pet);
        P.pet = null;
        saveGame();
        toast('📦 召唤兽已收进仓库');
        renderPetPanel();
      };
      list.appendChild(storeBtn);
    }

    P.petBox.forEach((pet, index) => {
      normalizePetRecord(pet);
      const row = document.createElement('div');
      row.className = 'list-item';
      row.style.marginTop = '6px';
      row.innerHTML = `
        <div class="li-icon" style="font-size:24px">${pet.icon}</div>
        <div class="li-body">
          <div class="li-name">${pet.name}</div>
          <div class="li-desc">❤️${Math.ceil(pet.hp)}/${pet.maxHp} · 🗡️${pet.atk} · 🛡️${pet.def} · 🎯资质 ${pet.aptitude?.hp||100}/${pet.aptitude?.atk||100}/${pet.aptitude?.def||100}/${pet.aptitude?.spd||100} · 技能 Lv.${pet.skillRank||1}</div>
        </div>
      `;
      const out = document.createElement('button');
      out.className = 'li-btn';
      out.textContent = '出仓';
      out.onclick = () => {
        const storedPet = P.petBox[index];
        if (!storedPet) return;
        if (P.pet) {
          P.petBox[index] = P.pet;
        } else {
          P.petBox.splice(index, 1);
        }
        P.pet = storedPet;
        saveGame();
        toast(`🐾 ${P.pet.name} 已出战`);
        renderPetPanel();
      };
      row.appendChild(out);
      const petSkill=PET_SKILLS[petBaseSpecies(pet)];
      if(petSkill){
        const study=document.createElement('button');
        study.className='li-btn';
        study.style.marginLeft='4px';
        study.textContent=(pet.skillRank||1)>=3?'技能满级':'研习';
        study.disabled=(pet.skillRank||1)>=3||P.gold<500;
        study.onclick=()=>studyPetSkill(pet);
        row.appendChild(study);
      }
      list.appendChild(row);
    });

    body.appendChild(storage);
  };

  /* ---------- 初始化新字段，兼容旧存档 ---------- */
  P.kills = Math.max(0, Number(P.kills) || 0);
  if (!P.kills && P.battles) P.kills = P.battles;
  P.bankGold = Math.max(0, Number(P.bankGold) || 0);
  if (!P.killStats || typeof P.killStats !== 'object') P.killStats = {};
  if (!Array.isArray(P.petBox)) P.petBox = [];

  saveGame();
})();

</script>
</div>
<script>
(function(){
  const intro=document.getElementById('gameIntro');
  if(!intro)return;
  intro.addEventListener('animationend',function(e){
    if(e.target===intro&&e.animationName==='introBackdrop')intro.remove();
  });
  window.setTimeout(function(){if(intro.isConnected)intro.remove();},8500);
})();
</script>

</body>
</html>
