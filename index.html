<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>梦幻西游 · 2.0版本</title>
<style>
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 1 批
   全局重置 / 木纹面板 / 顶部状态栏
   ============================================================ */
:root{
  --wood-dark:#2a1608;
  --wood:#5a3218;
  --wood-lt:#8a5228;
  --wood-hl:#a86a34;
  --gold:#f0c860;
  --gold-dk:#a87828;
  --gold-lt:#ffe8a0;
  --jade:#4a9a7a;
  --jade-dk:#2a6a52;
  --red:#c03030;
  --red-dk:#801818;
  --blue:#3a70c0;
  --blue-dk:#1a4080;
  --purple:#8050b0;
  --paper:#f0e0b8;
  --ink:#2a1a0a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Heiti SC",sans-serif;
  font-size:12px;
  background:#0a0604;
  color:#f0e0b8;
  display:flex;justify-content:center;
  user-select:none;
  -webkit-font-smoothing:antialiased;
}
#game{
  width:100%;max-width:640px;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:#1a0e08;
  box-shadow:0 0 80px rgba(0,0,0,.95);
}

/* ================= 通用木纹面板 ================= */
.wood{
  background:
    repeating-linear-gradient(92deg,
      rgba(0,0,0,.10) 0 2px,
      rgba(255,220,160,.03) 2px 5px,
      transparent 5px 9px),
    linear-gradient(180deg,#6b3a1a 0%,#4a2812 55%,#3a1f0e 100%);
  border:2px solid var(--wood-dark);
  border-radius:6px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,120,.22),
    inset 0 2px 4px rgba(255,220,160,.12),
    inset 0 -4px 8px rgba(0,0,0,.5),
    0 3px 8px rgba(0,0,0,.55);
  position:relative;
}
.wood::after{
  content:'';position:absolute;inset:3px;
  border:1px solid rgba(240,200,120,.16);
  border-radius:4px;pointer-events:none;
}

/* ================= 金色镶边面板 ================= */
.gold-frame{
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#5a3218,#3a1f0e);
  border:3px solid var(--gold-dk);
  border-radius:8px;
  box-shadow:
    inset 0 0 0 1px var(--gold),
    inset 0 0 24px rgba(240,200,96,.12),
    0 4px 16px rgba(0,0,0,.65);
  position:relative;
}
.gold-frame::before{
  content:'';position:absolute;inset:4px;
  border:1px dashed rgba(240,200,96,.35);
  border-radius:5px;pointer-events:none;
}

/* 金色卷轴标题 */
.scroll-title{
  display:inline-block;
  padding:3px 22px;
  font-size:12px;letter-spacing:4px;
  color:#3a1f0e;
  font-weight:bold;
  background:linear-gradient(180deg,var(--gold-lt),var(--gold),var(--gold-dk));
  border:2px solid #6a4810;
  border-radius:12px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    inset 0 -2px 4px rgba(120,80,20,.4),
    0 2px 5px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.5);
  position:relative;
}
.scroll-title::before,
.scroll-title::after{
  content:'❖';
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:9px;color:#6a4810;
}
.scroll-title::before{left:6px}
.scroll-title::after{right:6px}

/* ================= 顶部状态栏 ================= */
#topbar{
  flex-shrink:0;z-index:30;
  display:flex;align-items:stretch;gap:4px;
  padding:5px 6px 5px;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.15) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#5a3218,#2a1608);
  border-bottom:3px solid #140a04;
  box-shadow:
    0 3px 0 rgba(0,0,0,.4),
    0 4px 10px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(240,200,96,.25);
}

/* 头像框 */
#portrait{
  width:58px;height:64px;flex-shrink:0;
  background:linear-gradient(180deg,#6b3a18,#3a1f0e);
  border:2px solid var(--gold-dk);
  border-radius:5px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.55),
    inset 0 0 12px rgba(0,0,0,.6),
    0 2px 5px rgba(0,0,0,.5);
  display:flex;align-items:flex-end;justify-content:center;
  overflow:hidden;position:relative;
  cursor:pointer;
}
#portrait svg{width:100%;height:100%;display:block}
#portrait .frog-svg{display:none}
#portrait.avatar-frog .original-svg{display:none}
#portrait.avatar-frog .frog-svg{display:block}
#portrait::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  box-shadow:0 0 6px var(--gold);
}

/* 中段信息区 */
.info-mid{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:3px;
  justify-content:center;
}
.name-row{
  display:flex;align-items:center;gap:5px;
  min-width:0;
}
#pName{
  font-size:13px;font-weight:bold;
  color:var(--gold-lt);
  letter-spacing:.5px;
  text-shadow:0 1px 0 #000,0 0 8px rgba(240,200,96,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:92px;
}
#pSect{
  font-size:10px;color:#fff;
  padding:1px 7px;border-radius:9px;
  background:linear-gradient(180deg,var(--jade),var(--jade-dk));
  border:1px solid #163a2a;
  box-shadow:
    0 1px 0 rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.3);
  white-space:nowrap;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}
#pLv{
  font-size:10px;color:var(--gold);
  margin-left:auto;
  text-shadow:0 1px 0 #000;
  white-space:nowrap;
}
#pLv b{color:#fff;font-size:11px}

/* 三条状态条 */
.bars{
  display:flex;flex-direction:column;gap:3px;
}
.sbar{
  height:11px;position:relative;
  background:#180c04;
  border:1px solid #060302;
  border-radius:6px;
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.85),
    inset 0 -1px 0 rgba(255,220,160,.08);
  overflow:hidden;
}
.sbar .fill{
  height:100%;width:0;
  border-radius:5px;
  transition:width .3s ease;
  position:relative;
}
.sbar .fill::after{
  content:'';position:absolute;inset:0;
  border-radius:5px;
  background:linear-gradient(180deg,
    rgba(255,255,255,.45) 0%,
    rgba(255,255,255,.1) 40%,
    transparent 55%,
    rgba(0,0,0,.25) 100%);
}
.sbar.hp .fill{
  background:linear-gradient(90deg,#8a1010,#d02828 45%,#ff6050);
  box-shadow:0 0 6px rgba(224,48,48,.6);
}
.sbar.mp .fill{
  background:linear-gradient(90deg,#0a2090,#2a60d8 45%,#60a0ff);
  box-shadow:0 0 6px rgba(48,112,224,.6);
}
.sbar.exp .fill{
  background:linear-gradient(90deg,#906010,#e0a820 45%,#ffe070);
  box-shadow:0 0 6px rgba(240,184,48,.6);
}
.sbar .label{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 6px;
  font-size:8.5px;color:#fff;
  text-shadow:0 1px 2px #000;
  letter-spacing:.3px;
  pointer-events:none;
  font-weight:bold;
}
.sbar .label i{font-style:normal;color:#ffe8a0;font-weight:normal}

/* 金币框 */
#goldBox{
  flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 7px;
  border-left:1px solid rgba(240,200,96,.22);
  margin-left:1px;
}
#goldBox .g-icon{
  font-size:17px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
#goldBox .g-val{
  font-size:11px;font-weight:bold;
  color:var(--gold-lt);
  text-shadow:0 1px 0 #000,0 0 5px rgba(240,200,96,.6);
  white-space:nowrap;
  margin-top:1px;
}
#goldBox .g-val small{font-size:9px;color:#f0c860;font-weight:normal}

/* 状态图标行（气血/魔法小图标） */
.status-icons{
  display:flex;gap:6px;align-items:center;
  font-size:9px;color:#c0a870;
  margin-top:1px;
}
.status-icons span{
  display:flex;align-items:center;gap:2px;
  text-shadow:0 1px 0 #000;
}

/* ============================================================
   ↓↓↓ 第 1 批结束，第 2 批将接续：主视图区 / 地形块 / 玩家角色
   ============================================================ */


/* ===== 修复：第2/3批 CSS 已合并到同一个 style ===== */
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 2 批
   主视图区 / 地形块 / 玩家角色 / 场景HUD / 方向键
   ============================================================ */

/* ================= 主视图区 ================= */
#stage{
  flex:1;position:relative;overflow:hidden;
  background:#0a1a08;
  z-index:10;
}

/* 世界层：所有格子+角色都在这层 */
#world{
  position:absolute;inset:0;
  overflow:hidden;
}

/* ================= 地形块 ================= */
.tile{
  position:absolute;
  box-sizing:border-box;
  image-rendering:pixelated;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
  will-change:transform;
}

/* 草地（两种明度交错，制造像素草地感） */
.t-grass{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.04) 0 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#5aa044,#4a8836);
}
.t-grass2{
  background:
    repeating-linear-gradient(-45deg,
      rgba(0,0,0,.05) 0 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#4a8836,#3a7028);
}

.t-teleport-stone{background:radial-gradient(circle at 50% 40%,rgba(255,232,160,.38),rgba(90,60,25,.92) 65%);border:2px solid #c9a65e;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,235,170,.18),0 2px 6px rgba(0,0,0,.5);}
.t-teleport-stone .npc{font-size:26px;filter:drop-shadow(0 0 5px rgba(255,220,120,.85));}

/* 土路 */
.t-path{
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.06) 0 3px,
      transparent 3px 7px),
    linear-gradient(180deg,#c8a878,#b09060);
}

/* 水面 */
.t-water{
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.10) 0 2px,
      transparent 2px 6px),
    linear-gradient(180deg,#4a80c0,#2a5a98);
  animation:waterFlow 3s ease-in-out infinite;
}
.t-water2{
  background:
    repeating-linear-gradient(0deg,
      rgba(255,255,255,.08) 2px 4px,
      transparent 4px 8px),
    linear-gradient(180deg,#3a70b0,#205088);
  animation:waterFlow 3.5s ease-in-out infinite reverse;
}
@keyframes waterFlow{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
}

/* 树木（深绿底 + 树冠emoji） */
.t-tree{
  background:
    radial-gradient(circle at 50% 40%,#3a7a2a 0%,#2a5a1e 70%,#1e4416 100%);
}
.t-tree .deco{font-size:24px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

/* 岩石 */
.t-rock{
  background:
    radial-gradient(circle at 35% 30%,#a0a098 0%,#80807a 55%,#5a5a54 100%);
}
.t-rock .deco{font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

/* 沙地 */
.t-sand{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.03) 0 5px,
      transparent 5px 10px),
    linear-gradient(180deg,#e8d0a0,#d0b880);
}

/* 雪地 */
.t-snow{
  background:
    radial-gradient(circle at 30% 25%,#ffffff 0%,#e0eef8 50%,#c8dce8 100%);
}

/* 木桥 */
.t-bridge{
  background:
    repeating-linear-gradient(0deg,
      #8a5a30 0 8px,
      #6a4020 8px 9px);
  box-shadow:inset 0 0 0 2px #4a2810;
}

/* 建筑：墙 / 屋顶 / 地板 */
.t-wall{
  background:
    repeating-linear-gradient(0deg,
      #9a8060 0 12px,
      #7a6040 12px 14px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.08) 0 20px,
      transparent 20px 22px);
  box-shadow:inset 0 0 0 2px #4a3820;
}
.t-roof{
  background:
    repeating-linear-gradient(90deg,
      #b84030 0 10px,
      #a03020 10px 12px);
  box-shadow:inset 0 0 0 2px #601810;
}
.t-floor{
  background:
    repeating-linear-gradient(0deg,
      #c8a878 0 14px,
      #b09060 14px 15px),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.05) 0 14px,
      transparent 14px 15px);
}

/* 花丛 */
.t-flower{
  background:linear-gradient(180deg,#5aa04a,#3a8028);
}
.t-flower .deco{font-size:18px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

/* 岩浆（火山） */
.t-lava{
  background:
    radial-gradient(circle at 50% 50%,#ff8020 0%,#e04010 40%,#a01808 100%);
  animation:lavaPulse 1.5s ease-in-out infinite;
}
@keyframes lavaPulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.35)}
}

/* 虚空 */
.t-void{
  background:
    radial-gradient(circle at 50% 50%,#2a2a44 0%,#14142a 70%,#08081a 100%);
}

/* 建筑装饰图标 */
.tile .build{
  font-size:24px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
}
.tile .npc{
  font-size:22px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));
  animation:npcIdle 2s ease-in-out infinite;
}
@keyframes npcIdle{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2px)}
}

/* ================= 玩家角色 ================= */
#player{
  position:absolute;z-index:15;
  width:44px;height:54px;
  pointer-events:none;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.6));
  transition:left .12s linear,top .12s linear;
}
#player svg{width:100%;height:100%;display:block}
#player .frog-svg{display:none}
#player.avatar-frog .original-svg{display:none}
#player.avatar-frog .frog-svg{display:block}
#player.walking{
  animation:playerWalk .35s steps(2) infinite;
}
@keyframes playerWalk{
  0%,100%{transform:translateY(0) scaleY(1)}
  50%{transform:translateY(-3px) scaleY(.97)}
}

/* 玩家脚下光圈 */
#player::after{
  content:'';position:absolute;left:50%;bottom:-2px;
  width:34px;height:10px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(240,200,96,.55),rgba(240,200,96,0) 70%);
  border-radius:50%;
  pointer-events:none;
}

/* ================= 名字标签 ================= */
.name-tag{
  position:absolute;
  font-size:10px;font-weight:bold;
  color:#fff;
  white-space:nowrap;
  transform:translateX(-50%);
  pointer-events:none;
  z-index:16;
  text-shadow:
    0 1px 0 #000,
    1px 0 0 #000,
    -1px 0 0 #000,
    0 -1px 0 #000,
    0 0 4px rgba(0,0,0,.8);
  letter-spacing:.3px;
}
.name-tag.npc{color:#ffe070}
.name-tag.mob{color:#ff8060}
.name-tag.shop{color:#80d0ff}
.name-tag.boss{color:#ff5050;font-size:11px}

/* ================= 场景标题 ================= */
#sceneTitle{
  position:absolute;top:10px;left:50%;
  transform:translateX(-50%);
  z-index:12;
  padding:4px 20px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.95),rgba(26,14,8,.95));
  border:2px solid var(--gold-dk);
  border-radius:15px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.45),
    inset 0 1px 0 rgba(255,255,255,.1),
    0 3px 8px rgba(0,0,0,.65);
  font-size:11px;
  color:var(--gold-lt);
  letter-spacing:2px;
  text-shadow:0 1px 0 #000;
  pointer-events:none;
  white-space:nowrap;
}
#sceneTitle b{color:#fff;font-weight:bold}
#sceneTitle i{
  font-style:normal;color:#90c8a0;
  margin-left:5px;font-size:10px;
}

/* ================= 小地图按钮 ================= */
#miniMapControl{position:absolute;top:10px;right:10px;z-index:14;display:flex;flex-direction:column;align-items:center;gap:4px;}
#miniMapBtn,#teleportBtn{
  position:relative;top:auto;right:auto;
  z-index:14;
  width:46px;height:46px;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.1) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#7a4a20,#4a2812);
  border:2px solid var(--gold-dk);
  border-radius:7px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.5),
    inset 0 1px 0 rgba(255,255,255,.15),
    0 3px 7px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  cursor:pointer;
  transition:all .08s;
}
#miniMapBtn:active,#teleportBtn:active{
  transform:translateY(1px);
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.5),
    inset 0 2px 4px rgba(0,0,0,.5),
    0 1px 3px rgba(0,0,0,.55);
}
#miniMapBtn .mi,#teleportBtn .mi{
  font-size:18px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
}
#miniMapBtn .mt,#teleportBtn .mt{
  font-size:8px;color:var(--gold-lt);
  margin-top:2px;letter-spacing:.5px;
  text-shadow:0 1px 0 #000;
}
#playerCoordHud{padding:3px 5px;border:1px solid rgba(240,200,96,.65);border-radius:5px;background:rgba(24,13,7,.9);color:#ffe8a0;font-size:9px;font-weight:700;white-space:nowrap;}
#miniMapControl.map-open #playerCoordHud{display:none;}

/* ================= 方向键 ================= */
#dpad{
  position:absolute;right:12px;bottom:12px;
  z-index:18;
  display:grid;
  grid-template-columns:repeat(3,46px);
  grid-template-rows:repeat(3,46px);
  gap:3px;
}
#dpad button{
  font-family:inherit;
  font-size:22px;font-weight:bold;
  color:#ffe8a0;
  padding:0;
  display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218);
  border:2px solid #2a1608;
  border-radius:7px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.45),
    inset 0 -2px 3px rgba(0,0,0,.4),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.55);
  cursor:pointer;
  transition:all .06s;
  text-shadow:0 1px 0 #000,0 0 6px rgba(240,200,96,.4);
  -webkit-user-select:none;
}
#dpad button:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.45),
    inset 0 -1px 2px rgba(0,0,0,.4),
    0 0 0 #140a04,
    0 1px 3px rgba(0,0,0,.55);
}
#dpad .u{grid-column:2;grid-row:1}
#dpad .l{grid-column:1;grid-row:2}
#dpad .c{
  grid-column:2;grid-row:2;
  font-size:14px;
  background:
    radial-gradient(circle at 50% 35%,#a05830,#5a3218);
  color:#ffe070;
}
#dpad .r{grid-column:3;grid-row:2}
#dpad .d{grid-column:2;grid-row:3}

/* ================= 场景浮动提示 ================= */
#toast{
  position:absolute;left:50%;bottom:110px;
  transform:translateX(-50%) translateY(6px);
  z-index:30;
  padding:8px 18px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.96),rgba(26,14,8,.96));
  border:2px solid var(--gold-dk);
  border-radius:15px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,96,.4),
    0 4px 10px rgba(0,0,0,.7);
  color:var(--gold-lt);
  font-size:12px;
  letter-spacing:.5px;
  text-shadow:0 1px 0 #000;
  white-space:nowrap;
  max-width:90%;
  overflow:hidden;text-overflow:ellipsis;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= 顶部提示条（场景名切换） ================= */
#sceneBanner{
  position:absolute;top:44%;left:50%;
  transform:translate(-50%,-50%) scale(.85);
  z-index:40;
  padding:10px 34px;
  background:
    linear-gradient(180deg,rgba(58,31,16,.94),rgba(26,14,8,.94));
  border-top:2px solid var(--gold);
  border-bottom:2px solid var(--gold);
  box-shadow:
    0 0 24px rgba(240,200,96,.35),
    inset 0 0 24px rgba(240,200,96,.1);
  font-size:20px;font-weight:bold;
  letter-spacing:8px;
  color:var(--gold-lt);
  text-shadow:0 2px 0 #000,0 0 16px rgba(240,200,96,.8);
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease,transform .4s ease;
}
#sceneBanner.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

/* ============================================================
   ↓↓↓ 第 2 批结束，第 3 批将接续：底部菜单栏 / 弹窗容器 / 完整HTML结构
   ============================================================ */
/* ============================================================
   梦幻西游 · Q版像素单机  —— 第 3 批
   底部菜单栏 / 弹窗系统 / 通用对话框
   ============================================================ */

/* ================= 底部主菜单栏 ================= */
#bottomBar{
  flex-shrink:0;z-index:25;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:4px;
  padding:6px 8px 8px;
  background:
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.15) 0 2px,
      transparent 2px 6px),
    linear-gradient(0deg,#2a1608,#5a3218 60%,#3a1f0e);
  border-top:3px solid #140a04;
  box-shadow:
    0 -3px 0 rgba(0,0,0,.4),
    0 -5px 12px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(240,200,96,.25);
}

.menu-btn{
  position:relative;
  padding:6px 2px 5px;
  font-family:inherit;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;
  color:#ffe8a0;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218 55%,#3a1f0e);
  border:2px solid #2a1608;
  border-radius:7px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -3px 5px rgba(0,0,0,.45),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.5);
  cursor:pointer;
  transition:all .07s;
  -webkit-user-select:none;
  overflow:hidden;
}
.menu-btn::before{
  content:'';position:absolute;inset:2px;
  border:1px solid rgba(240,200,96,.18);
  border-radius:5px;pointer-events:none;
}
.menu-btn .mi{
  font-size:20px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  transition:transform .1s;
}
.menu-btn .mt{
  font-size:10px;font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 1px 0 #000,0 0 5px rgba(240,200,96,.4);
  color:#ffe8a0;
}
.menu-btn:active{
  transform:translateY(3px);
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -1px 3px rgba(0,0,0,.45),
    0 0 0 #140a04,
    0 1px 3px rgba(0,0,0,.5);
}
.menu-btn:active .mi{transform:scale(.9)}
.menu-btn.disabled{
  filter:grayscale(.7) brightness(.6);
  cursor:not-allowed;
  opacity:.55;
}

/* 红色高亮按钮（战斗时出现） */
.menu-btn.danger{
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#c03030,#801818 55%,#501010);
}
.menu-btn.danger .mt{color:#ffd0d0;text-shadow:0 1px 0 #000,0 0 6px rgba(255,80,80,.6)}

/* 带红点通知 */
.menu-btn.has-dot::after{
  content:'';position:absolute;top:3px;right:3px;
  width:8px;height:8px;
  background:radial-gradient(circle,#ff4040,#a01010);
  border:1px solid #400808;
  border-radius:50%;
  box-shadow:0 0 6px rgba(255,64,64,.8);
  animation:dotPulse 1.2s ease-in-out infinite;
}
@keyframes dotPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.25)}
}

/* ================= 弹窗遮罩层 ================= */
.modal{
  position:absolute;inset:0;z-index:100;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(10,6,4,.72) 0%,
      rgba(4,2,1,.9) 100%);
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
  backdrop-filter:blur(2px);
}
.modal.show{
  opacity:1;pointer-events:auto;
}

/* ================= 通用弹窗容器 ================= */
.dialog{
  width:100%;max-width:440px;
  max-height:88%;
  display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(92deg,
      rgba(0,0,0,.10) 0 2px,
      rgba(255,220,160,.03) 2px 5px,
      transparent 5px 9px),
    linear-gradient(180deg,#6b3a1a 0%,#4a2812 55%,#3a1f0e 100%);
  border:3px solid var(--wood-dark);
  border-radius:10px;
  box-shadow:
    inset 0 0 0 1px rgba(240,200,120,.28),
    inset 0 2px 6px rgba(255,220,160,.12),
    inset 0 -4px 10px rgba(0,0,0,.5),
    0 6px 24px rgba(0,0,0,.8),
    0 0 60px rgba(240,200,96,.1);
  transform:scale(.92) translateY(8px);
  transition:transform .25s cubic-bezier(.25,1.4,.5,1);
  overflow:hidden;
  position:relative;
}
.dialog::before{
  content:'';position:absolute;inset:5px;
  border:1px dashed rgba(240,200,96,.25);
  border-radius:6px;pointer-events:none;z-index:1;
}
.modal.show .dialog{
  transform:scale(1) translateY(0);
}

/* 弹窗头部（带卷轴标题） */
.dialog-head{
  flex-shrink:0;
  position:relative;
  padding:14px 40px 10px;
  text-align:center;
  background:
    linear-gradient(180deg,
      rgba(90,50,24,.6),
      rgba(40,20,8,.4));
  border-bottom:2px solid rgba(240,200,96,.22);
  box-shadow:inset 0 1px 0 rgba(240,200,96,.25);
}
.dialog-title{
  display:inline-block;
  padding:4px 26px;
  font-size:14px;font-weight:bold;
  letter-spacing:5px;
  color:#3a1f0e;
  background:
    linear-gradient(180deg,var(--gold-lt),var(--gold) 50%,var(--gold-dk));
  border:2px solid #6a4810;
  border-radius:13px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -2px 4px rgba(120,80,20,.4),
    0 2px 6px rgba(0,0,0,.5);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  position:relative;
}
.dialog-title::before,
.dialog-title::after{
  content:'❖';
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:10px;color:#6a4810;
}
.dialog-title::before{left:8px}
.dialog-title::after{right:8px}

/* 关闭按钮 */
.dialog-close{
  position:absolute;
  top:10px;right:10px;
  width:32px;height:32px;
  padding:0;
  font-family:inherit;
  font-size:16px;font-weight:bold;
  color:#ffe8a0;
  background:
    linear-gradient(180deg,#a83828,#681810);
  border:2px solid #2a0808;
  border-radius:50%;
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),
    inset 0 -2px 3px rgba(0,0,0,.5),
    0 2px 5px rgba(0,0,0,.6);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .08s;
  z-index:3;
  text-shadow:0 1px 0 #000;
}
.dialog-close:active{
  transform:translateY(2px);
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),
    inset 0 -1px 2px rgba(0,0,0,.5),
    0 0 0 rgba(0,0,0,.6);
}

/* 弹窗内容区 */
.dialog-body{
  flex:1;min-height:0;
  overflow-y:auto;
  padding:12px 14px;
  position:relative;z-index:2;
  scrollbar-width:thin;
  scrollbar-color:rgba(240,200,96,.45) rgba(0,0,0,.3);
}
.dialog-body::-webkit-scrollbar{width:8px}
.dialog-body::-webkit-scrollbar-track{
  background:rgba(0,0,0,.4);
  border-radius:4px;
}
.dialog-body::-webkit-scrollbar-thumb{
  background:
    linear-gradient(180deg,var(--gold),var(--gold-dk));
  border-radius:4px;
  border:1px solid #6a4810;
}

/* 弹窗底部按钮区 */
.dialog-foot{
  flex-shrink:0;
  padding:10px 14px 12px;
  display:flex;gap:8px;
  justify-content:center;
  background:
    linear-gradient(0deg,rgba(26,14,8,.6),transparent);
  border-top:1px solid rgba(240,200,96,.18);
  position:relative;z-index:2;
}

/* ================= 通用按钮 ================= */
.btn{
  flex:1;min-width:80px;
  padding:10px 14px;
  font-family:inherit;
  font-size:12.5px;font-weight:bold;
  letter-spacing:2px;
  color:#ffe8a0;
  background:
    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,
      transparent 2px 4px),
    linear-gradient(180deg,#8a5228,#5a3218 55%,#3a1f0e);
  border:2px solid #2a1608;
  border-radius:6px;
  box-shadow:
    inset 0 1px 0 rgba(240,200,96,.5),
    inset 0 -3px 5px rgba(0,0,0,.45),
    0 3px 0 #140a04,
    0 4px 7px rgba(0,0,0,.5);
  cursor:pointer;
  transition:all .07s;

.btn::before{

.btn:active{

.avatar-choice{

/* 主按钮（金色） */
.btn.primary{

    repeating-linear-gradient(45deg,

  color:#3a1f0e;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.6),

}
.btn.primary::before{border-color:rgba(120,80,20,.3)}
/* 危险按钮（红色） */
.btn.danger{

    repeating-linear-gradient(45deg,
      rgba(0,0,0,.08) 0 2px,

  color:#ffd0d0;
  border-color:#2a0808;
  box-shadow:
    inset 0 1px 0 rgba(255,180,140,.5),

/* 小按钮 */
.btn.small{

.btn.small:active{

   ============================================================ */


/* ============================================================
   响应式适配：手机竖屏 / 手机横屏 / 平板 / 电脑
   ============================================================ */
html,body{width:100%;min-width:0;}
#game{width:100%;max-width:none;height:100dvh;}

/* 电脑 / 大屏：采用宽屏游戏布局，避免原来的 640px 限制 */
@media (min-width: 900px){
  body{align-items:center;}
  #game{
    width:min(1180px,100vw);
    height:min(900px,100dvh);
    border-left:1px solid #241207;
    border-right:1px solid #241207;
  }
  #topbar{padding:7px 10px;gap:8px;}
  #bottomBar{padding:7px 12px 9px;gap:7px;}
  .menu-btn{min-height:58px;}
  .menu-btn .mi{font-size:22px;}
  #dpad{right:20px;bottom:20px;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);}
  #dpad button{font-size:24px;}
  #toast{bottom:120px;}
}

/* 手机竖屏：顶部信息、地图和底部菜单紧凑排列 */
@media (max-width: 899px) and (orientation: portrait){
  #topbar{min-height:72px;padding:4px 5px;gap:3px;}
  #portrait{width:50px;height:58px;}

.map-monster{

/* ============================================================
   最终设备适配层：手机 / 平板 / 电脑
   - 游戏区域始终严格限制在视口内
   - 禁止页面横向/纵向拖动
   - 禁止双击缩放、双指缩放
   - 根据实际视口高度使用 dvh/svh，避免移动端地址栏造成溢出
   ============================================================ */
html, body{
  width:100%;
  min-width:0;
  max-width:100%;
  height:100%;
  min-height:100%;
  margin:0;
  overflow:hidden !important;
  overscroll-behavior:none;
  overscroll-behavior-x:none;
  overscroll-behavior-y:none;
  touch-action:none;
}
body{
  align-items:stretch;
  justify-content:center;
}
#game{
  width:100%;
  max-width:none;
  height:100vh;
  height:100svh;
  height:100dvh;
  min-height:0;
  max-height:100dvh;
  margin:0 auto;
  overflow:hidden;
  touch-action:none;
}
#stage{
  min-width:0;
  min-height:0;
  width:100%;
  overflow:hidden !important;
  touch-action:none;
}
#world{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:none;
}
#dpad,
#dpad button,
#miniMapBtn,
.menu-btn,
button{
  touch-action:manipulation;
}

/* 手机竖屏 */
@media (max-width:599px) and (orientation:portrait){
  #game{width:100vw;max-width:100vw;}
  #topbar{flex:0 0 auto;}
  #stage{flex:1 1 auto;}
  #bottomBar{flex:0 0 auto;}
}

/* 手机横屏 */
@media (max-width:899px) and (orientation:landscape){
  #game{width:100vw;max-width:100vw;}
}

/* 平板：竖屏、横屏都使用完整视口 */
@media (min-width:600px) and (max-width:1199px){
  #game{
    width:100vw;
    max-width:100vw;
    height:100dvh;
    max-height:100dvh;
  }
}

/* 电脑：完整使用浏览器窗口，不产生左右空白或横向拖动 */
@media (min-width:1200px){
  #game{
    width:100vw;
    max-width:100vw;
    height:100dvh;
    max-height:100dvh;
    border-left:0;
    border-right:0;
  }
}

/* 超宽/超高显示器：内容仍限制在视口，不允许页面横向移动 */
@media (min-aspect-ratio:2/1){
  #game{width:100vw;max-width:100vw;}
}

/* 确定性随机（用于地图生成） */
function hash(c, r, salt){
  let h = (Math.imul(c|0, 73856093) ^ Math.imul(r|0, 19349663) ^ Math.imul(salt|0, 83492791)) >>> 0;
  h ^= h >>> 15;
  h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h / 4294967296;
}
function noise2(x, y, salt){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi, salt);
  const b = hash(xi+1, yi, salt);
  const c = hash(xi, yi+1, salt);
  const d = hash(xi+1, yi+1, salt);
  const sx = xf * xf * (3 - 2*xf);
  const sy = yf * yf * (3 - 2*yf);
  return (a*(1-sx) + b*sx)*(1-sy) + (c*(1-sx) + d*sx)*sy;
}
/* 数字格式化 */
function fmt(n){
  n = Math.floor(n);
  if (n < 1e4) return String(n);
  if (n >= 1e44) return n.toExponential(2).replace('e+','e');
  const u = [[1e4,'万'],[1e8,'亿'],[1e12,'兆'],[1e16,'京'],[1e20,'垓'],
             [1e24,'秭'],[1e28,'穰'],[1e32,'沟'],[1e36,'涧'],[1e40,'正']];
  for (let i = u.length-1; i >= 0; i--){
    if (n >= u[i][0]){
      const v = n / u[i][0];
      return (v >= 1000 ? v.toFixed(0) : v.toFixed(1)) + u[i][1];
    }
  }
  return String(n);
}

function normalizePetGear(){
 if(!Array.isArray(P.petGearInventory))P.petGearInventory=[];
 P.petGearInventory=P.petGearInventory.filter(g=>g&&PET_GEAR_CATALOG[g.id]&&Number.isFinite(Number(g.level))).map(g=>({id:g.id,level:Math.max(0,Math.min(3,Math.floor(Number(g.level)||0)))}));
 if(!P.petGearEquipped||typeof P.petGearEquipped!=='object')P.petGearEquipped={weapon:null,armor:null,charm:null};
 ['weapon','armor','charm'].forEach(slot=>{const id=P.petGearEquipped[slot];if(!id||!PET_GEAR_CATALOG[id]||PET_GEAR_CATALOG[id].slot!==slot||!P.petGearInventory.some(g=>g.id===id))P.petGearEquipped[slot]=null;});

function normalizePetRecord(pet){
 if(!pet||typeof pet!=='object')return null;
 const base=PETS.find(x=>x.id===pet.id);
 pet.lv=Math.max(1,Math.min(100,Math.floor(Number(pet.lv)||1)));
 pet.exp=Math.max(0,Math.floor(Number(pet.exp)||0));
 pet.stage=Math.max(0,Math.floor(Number(pet.stage)||0));
 pet.speciesId=petBaseSpecies(pet);
 if(!pet.aptitude||typeof pet.aptitude!=='object')pet.aptitude={hp:100,atk:100,def:100,spd:100};
 ['hp','atk','def','spd'].forEach(k=>{pet.aptitude[k]=Math.max(80,Math.min(120,Math.floor(Number(pet.aptitude[k])||100)));});
 pet.skillRank=Math.max(1,Math.min(3,Math.floor(Number(pet.skillRank)||1)));
 pet.skillActions=Math.max(0,Math.floor(Number(pet.skillActions)||0));
 if(!Number.isFinite(Number(pet.maxHp))||Number(pet.maxHp)<=0)pet.maxHp=base?base.hp:100;
 ['hp','atk','def','spd'].forEach(k=>{const fallback=base&&base[k]||10;pet[k]=Math.max(k==='hp'?1:0,Math.floor(Number(pet[k])||fallback));});
 pet.maxHp=Math.max(1,Math.floor(Number(pet.maxHp)||pet.hp));pet.hp=clamp(pet.hp,0,pet.maxHp);
 return pet;
}
function petExpNeed(level){return Math.floor(35*Math.pow(Math.max(1,level),1.45));}
function gainPetExp(amount){
 const pet=normalizePetRecord(P.pet);if(!pet||!Number.isFinite(amount)||amount<=0)return 0;
 pet.exp+=Math.floor(amount);let levels=0;
 while(pet.lv<100&&pet.exp>=petExpNeed(pet.lv)){
  pet.exp-=petExpNeed(pet.lv);pet.lv++;levels++;
  const hpGain=Math.max(5,Math.floor(pet.maxHp*.035));const hpGrowth=Math.max(1,Math.floor(hpGain*pet.aptitude.hp/100));pet.maxHp+=hpGrowth;pet.hp=Math.min(pet.maxHp,pet.hp+hpGrowth);
  pet.atk+=Math.max(1,Math.floor(pet.atk*.025*pet.aptitude.atk/100));pet.def+=Math.max(1,Math.floor(pet.def*.025*pet.aptitude.def/100));if(pet.lv%5===0)pet.spd+=1+Math.max(0,Math.floor((pet.aptitude.spd-100)/10));
  const evo=PET_EVOLUTIONS[pet.id];
  if(evo&&pet.lv>=evo.at&&pet.stage===0){
   const ratio=pet.hp/pet.maxHp;pet.id=evo.id;pet.name=evo.name;pet.icon=evo.icon;pet.desc=evo.desc;pet.stage=1;
   pet.maxHp=Math.floor(pet.maxHp*1.35);pet.hp=Math.max(1,Math.floor(pet.maxHp*ratio));pet.atk=Math.floor(pet.atk*1.3);pet.def=Math.floor(pet.def*1.25);pet.spd=Math.floor(pet.spd*1.1);
   toast('✨ '+pet.name+' 进化成功！');addLog('【召唤兽】'+pet.name+' 完成血脉进化','good');
  }
 }
 if(levels){toast('🐾 '+pet.name+' 提升 '+levels+' 级');addLog('【召唤兽】'+pet.name+' 获得 '+Math.floor(amount)+' 点经验','good');}
 return levels;
}
function rollPetCaptureOffer(){
 if(P.petCaptureOffer||!Array.isArray(P.petBox)||P.petBox.length>=6)return false;
 const defeated=battle.units.filter(u=>u.isEnemy&&!u.isBoss&&!u.alive);
 if(!defeated.length||Math.random()>.22)return false;
 const enemy=defeated.reduce((a,b)=>(b.lv||1)>(a.lv||1)?b:a,defeated[0]);
 const id=(enemy.lv||1)<=10?'huahua':(enemy.lv||1)<=20?'linghu':(enemy.lv||1)<=30?'hupo':(enemy.lv||1)<=40?'xiaolong':'jinwu';

function capturePet(){
 const offer=P.petCaptureOffer;if(!offer){toast('当前没有可捕捉的灵宠踪迹');return false;}
 if((Number(P.bag.petSeal)||0)<1){toast('需要捕灵符，可在灵兽园购买');return false;}
 if(!P.pet&&P.petBox.length>=6){toast('召唤兽仓库已满');return false;}
 const t=PETS.find(p=>p.id===offer.id);if(!t){P.petCaptureOffer=null;saveGame();return false;}
 P.bag.petSeal--;const chance=clamp(.72+(P.lv-(offer.enemyLv||1))*.025,.15,.95),success=Math.random()<chance;

  const lv=Math.max(1,Math.min(P.lv,offer.enemyLv||1)),scale=1+(lv-1)*.035;
  const aptitude=petAptitudeRoll();
  const pet={id:t.id,speciesId:t.id,name:t.name,icon:t.icon,desc:t.desc,hp:Math.floor(t.hp*scale),maxHp:Math.floor(t.hp*scale),atk:Math.floor(t.atk*scale),def:Math.floor(t.def*scale),spd:Math.floor(t.spd*scale),lv,exp:0,stage:0,aptitude,skillRank:1,skillActions:0};
  if(!P.pet)P.pet=pet;else P.petBox.push(pet);
  toast('🎉 成功捕捉 '+pet.name+'！');addLog('【召唤兽】野外捕捉 '+pet.name,'good');
 }else{toast('捕捉失败，灵宠挣脱了！');addLog('【召唤兽】捕捉失败','warn');}
 P.petCaptureOffer=null;updateHUD();saveGame();renderPetPanel();return success;
}

/* 经验公式 */
function expNeed(){
  return Math.floor(60 * Math.pow(P.lv, 1.65));
}

/* 开发者辅助：一键提升至满级（当前版本上限 100 级） */
const DEV_MAX_LEVEL = 100;
/* 开发者辅助：一键设置巨额银两（安全整数范围内） */
const DEV_INFINITE_GOLD = 999999999999999;
function developerInfiniteGold(){
  if(!P || !Number.isFinite(P.gold)){toast('角色银两数据无效');return false;}
  if(!confirm('确定将身上银两设置为 '+fmt(DEV_INFINITE_GOLD)+' 两？此操作会立即保存。'))return false;
  P.gold=DEV_INFINITE_GOLD;
  updateHUD();
  saveGame();
  addLog('【开发者】一键设置巨额银两','good');
  toast('💰 已获得巨额银两！');
  return P.gold;
}

function developerMaxLevel(){
  if(!P.sect || !SECTS.some(s=>s.id===P.sect)){toast('请先选择门派，再使用一键满级');return false;}
  if(P.lv>=DEV_MAX_LEVEL){toast('当前已经是满级 Lv.'+DEV_MAX_LEVEL);return false;}
  if(!confirm('确定将角色直接提升至 Lv.'+DEV_MAX_LEVEL+'？此操作会立即生效并自动保存。'))return false;
  const sect=SECTS.find(s=>s.id===P.sect);
  const gained=DEV_MAX_LEVEL-P.lv;
  for(let lv=P.lv+1;lv<=DEV_MAX_LEVEL;lv++){
    P.maxHp+=Math.floor(sect.grow.hp);
    P.maxMp+=Math.floor(sect.grow.mp);
    P.atk+=Math.floor(sect.grow.atk);
    P.def+=Math.floor(sect.grow.def);
    P.spd+=Math.floor(sect.grow.spd);
    P.magic+=Math.floor(sect.grow.magic);
  }
  P.lv=DEV_MAX_LEVEL;
  P.exp=0;
  P.hp=P.maxHp;
  P.mp=P.maxMp;
  updateHUD();
  saveGame();
  addLog('【开发者】一键满级：Lv.'+DEV_MAX_LEVEL,'good');
  toast('🌟 已提升至满级 Lv.'+DEV_MAX_LEVEL+'！');
  return gained;
}


/* 获得经验 */
function gainExp(amount){
  P.exp += amount;
  let leveled = false;
  while (P.exp >= expNeed()){
    P.exp -= expNeed();
    P.lv++;
    const s = SECTS.find(x => x.id === P.sect);
    if (s){
      P.maxHp += Math.floor(s.grow.hp);
      P.maxMp += Math.floor(s.grow.mp);
      P.atk   += Math.floor(s.grow.atk);
      P.def   += Math.floor(s.grow.def);
      P.spd   += Math.floor(s.grow.spd);
      P.magic += Math.floor(s.grow.magic);
      P.hp = P.maxHp;
      P.mp = P.maxMp;
    }
    leveled = true;
    // 检查新技能
    const skills = getSectSkills().filter(sk => sk.lv === P.lv);
    skills.forEach(sk => {
      toast(`📖 领悟了【${sk.name}】！`);
      addLog(`【升级】领悟新技能：${sk.name}`, 'good');
    });
  }
  if (leveled){
    toast(`🌟 等级提升！当前 Lv.${P.lv}`);
    updateHUD();
  }
}

/* 获取门派技能 */
function getSectSkills(){
  if (!P.sect) return [];
  const s = SECTS.find(x => x.id === P.sect);
  return s ? s.skills.filter(sk => sk.lv <= P.lv && sk.type !== 'special') : [];
}

/* 自由转换门派：保留银两、背包、地图进度等；等级/经验/召唤兽清零 */
function convertSect(id){
  const next = SECTS.find(x => x.id === id);
  if (!next || id === P.sect) {
    if (id === P.sect) toast('你已经属于这个门派了');
    return;
  }
  if (typeof battle !== 'undefined' && battle.active) {
    toast('战斗中无法转换门派');
    return;
  }
  const old = SECTS.find(x => x.id === P.sect);
  const accepted = window.confirm(
    '确定转换为【' + next.name + '】吗？\n\n转换后将永久失去：\n• 当前等级与全部经验（重置为 Lv.1）\n• 当前召唤兽与仓库中的所有宠物\n\n银两、背包物品、任务、地图进度和角色外观会保留。'
  );
  if (!accepted) return;

  P.sect = id;
  P.lv = 1;
  P.exp = 0;
  P.pet = null;

/* 存档导入导出 */
function exportSave(){
  if (!saveGame()){
    toast('存档失败，无法下载');
    return;
  }

  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) throw new Error('没有可导出的存档');

    const blob = new Blob([raw], {type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    link.href = url;
    link.download = `梦幻西游存档-${stamp}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
    toast('💾 存档已下载');
  }catch(err){
    console.warn('下载存档失败：', err);
    toast('下载存档失败');
  }
}

async function importSaveFile(file){
  if (!file) return;

  try{
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || Array.isArray(data)){
      throw new Error('存档格式无效');
    }
    if (!SECTS.some(s => s.id === data.sect)){
      throw new Error('存档缺少有效门派');
    }
    if (!applySaveData(data)){
      throw new Error('存档内容无效');
    }

    if (!saveGame()){
      throw new Error('导入后保存失败');
    }
    updateHUD();
    renderWorld();
    startGameLoop();
    closeModal('modalChar');
    toast('📥 存档已上传并读取');
  }catch(err){
    console.warn('上传存档失败：', err);
    toast('上传存档失败，请选择有效的存档文件');
  }
}

$('btnExportSave').addEventListener('click', exportSave);
$('btnImportSave').addEventListener('click', () => $('saveFileInput').click());
$('saveFileInput').addEventListener('change', e => {
  const [file] = e.target.files;
  importSaveFile(file);
  e.target.value = '';
});

function renderBagPanel(){
  const body = $('bagBody');
  const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
  
  // 计算容量
  const used = keys.length;
  const cap = 20;
  
  let html = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:6px 10px;background:linear-gradient(180deg,rgba(240,200,96,.12),transparent);border:1.5px solid rgba(240,200,96,.3);border-radius:6px">

    </div>
    <div style="display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap">
      <button class="btn small ${bagFilter==='all'?'primary':''}" data-filter="all">全部</button>
      <button class="btn small ${bagFilter==='potion'?'primary':''}" data-filter="potion">药品</button>
      <button class="btn small ${bagFilter==='gem'?'primary':''}" data-filter="gem">宝石</button>
      <button class="btn small ${bagFilter==='exp'?'primary':''}" data-filter="exp">修炼</button>
      <button class="btn small ${bagFilter==='special'?'primary':''}" data-filter="special">特殊</button>
    </div>
  `;
  
  // 过滤
  let displayKeys = keys;
  if (bagFilter !== 'all'){
    displayKeys = keys.filter(k => ITEMS[k] && ITEMS[k].type === bagFilter);
  }
  
  if (!displayKeys.length){
    html += `<div class="empty-tip"><span class="ei">🎒</span>${keys.length?'此分类下暂无物品':'背包空空如也'}</div>`;
  } else {
    html += '<div id="bagItems"></div>';
  }
  
  body.innerHTML = html;
  
  // 绑定过滤按钮
  body.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      bagFilter = btn.dataset.filter;
      renderBagPanel();
    });
  });
  
  // 渲染物品
  if (displayKeys.length){
    const list = body.querySelector('#bagItems');
    displayKeys.forEach(id => {
      const it = ITEMS[id];
      if (!it) return;
      const rare = it.rare || 0;
      const itEl = document.createElement('div');
      itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
      itEl.innerHTML = `
        <div class="li-icon" style="font-size:22px">${it.icon}</div>
        <div class="li-body">
          <div class="li-name">${it.name}<span class="li-count">×${P.bag[id]}</span></div>
          <div class="li-desc">${it.desc}</div>
        </div>
      `;
      const btn = document.createElement('button');
      btn.className = 'li-btn';
      btn.textContent = it.type === 'gem' ? '镶嵌' : '使用';
      btn.addEventListener('click', () => {
        useItem(id);
        renderBagPanel();
      });
      itEl.appendChild(btn);
      list.appendChild(itEl);
    });
  }
}

/* 使用物品 */
function useItem(id){
  if (!P.bag[id] || P.bag[id] <= 0) return;
  const it = ITEMS[id];
  if (!it || !it.use) return;
  
  const result = it.use();
  P.bag[id]--;
  if (P.bag[id] <= 0) delete P.bag[id];
  
  toast(`${it.icon} ${it.name}：${result}`);
  addLog(`【使用】${it.name} · ${result}`, 'good');
  updateHUD();
  renderWorld();
}

function petAptitudeGrade(value){
  const n=Math.max(80,Math.min(120,Math.floor(Number(value)||100)));
  return n>=115?'卓越':n>=108?'优秀':n>=100?'良好':n>=92?'普通':'偏低';
}
function renderPetAptitudeDetails(pet){
  normalizePetRecord(pet);
  const fields=[['hp','气血','❤️'],['atk','攻击','⚔️'],['def','防御','🛡️'],['spd','速度','👟']];
  return '<div style="margin-top:8px;padding:8px;border:1px solid rgba(210,170,255,.28);border-radius:6px;background:rgba(80,40,120,.10)"><b style="color:#e0c0ff">🎯 资质详情</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px">'+fields.map(([key,label,icon])=>{const value=pet.aptitude[key],pct=Math.max(0,Math.min(100,(value-80)/40*100));return '<div style="font-size:10px"><div style="display:flex;justify-content:space-between;color:#e8d8ff"><span>'+icon+' '+label+'</span><b>'+value+' · '+petAptitudeGrade(value)+'</b></div><div style="height:5px;margin-top:3px;border-radius:5px;background:#24172e;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#8050b0,#d0a0ff)"></div></div></div>';}).join('')+'</div><div style="margin-top:6px;color:#a98fbe;font-size:9.5px">资质范围 80–120；数值越高，对应属性升级成长越好。</div></div>';
}
function petSkillEffectText(skill,rank){
  if(!skill)return '暂无专属技能';
  if(skill.type==='heal')return '当前效果：每三次行动恢复最大气血的 '+Math.round(skill.power*rank*100)+'%';
  const multiplier=skill.power+(rank-1)*.18;
  let text='当前效果：每三次行动造成 '+multiplier.toFixed(2)+' 倍'+(skill.type==='magic'?'法术':'攻击')+'伤害';
  if(skill.effect==='stun')text+='；另有 20% 概率定身';
  if(skill.effect==='burn')text+='；追加灼烧伤害随技能等级提升';
  return text;
}
function studyPetSkill(pet){
  if(!pet||!(P.pet===pet||(Array.isArray(P.petBox)&&P.petBox.includes(pet))))return false;
  normalizePetRecord(pet);
  const skill=PET_SKILLS[pet.speciesId],rank=pet.skillRank||1,cost=500;
  if(!skill){toast('该召唤兽没有可研习的专属技能');return false;}
  if(rank>=3){toast('专属技能已经满级');return false;}
  if(!Number.isFinite(P.gold)||P.gold<cost){toast('银两不足，需要 500 两');return false;}
  P.gold-=cost;pet.skillRank=rank+1;
  saveGame();updateHUD();
  toast('📘 '+skill.name+' 提升至 '+pet.skillRank+' 级！');
  renderPetPanel();
  return true;
}

        </div>
        <div style="margin-top:4px;font-size:10px;color:#c0a870">
          进度 <b style="color:#ffe8a0">${cur}</b> / ${q.target}

          <span style="color:#f0c860">⭐${q.reward.exp}</span>
        </div>

    if (!done && cur >= q.target){
      const btn = document.createElement('button');
      btn.className = 'li-btn';
      btn.textContent = '领取';
      btn.addEventListener('click', () => {
        P.flags[q.id] = true;
        P.questDone++;
        P.gold += q.reward.gold;
        gainExp(q.reward.exp);
        toast(`🎉 完成【${q.name}】！+${q.reward.gold}两 +${q.reward.exp}经验`);

      tag.style.color = '#80ffa0';
      tag.innerHTML = '已领';
      it.appendChild(tag);
    }
    
    body.appendChild(it);
  });
}

/* ================= 地形缓存 ================= */
const tileCache = new Map();
const TILE_CACHE_LIMIT = 5000;

/* 判断某坐标属于哪个场景 */
function getSceneAt(x, y){
  let best = null, bestD = Infinity;
  for (const s of SCENES){
    const d = Math.hypot(x - s.cx, y - s.cy);
    if (d < s.radius && d < bestD){ best = s; bestD = d; }
  }
  return best;
}

/* 判断是否城镇（长安城） */
function isTown(x, y){
  const d = Math.hypot(x, y);
  return d < 10;
}

/* ================= 生成瓦片 ================= */
function getTile(x, y){
  const key = x + ',' + y;
  if (tileCache.has(key)) return tileCache.get(key);
  
  const scene = getSceneAt(x, y);
  const distOrigin = Math.hypot(x, y);
  let tile;
  
  if (isTown(x, y)){
    /* ---- 长安城 ---- */
    const dt = Math.hypot(x, y);
    if (dt < 4.5){
      // 中心广场
      tile = (Math.abs(x) < 1 && Math.abs(y) < 1) ? 'floor-center' : 'floor';
      // 中心石碑
      if (x === 0 && y === -2) tile = 'build-memorial';
      // 摊位
      if ((x === -3 && y === 1) || (x === 3 && y === 1)) tile = 'build-stall';
    } else if (dt < 8){
      // 内城街区
      const n = noise2(x*0.5, y*0.5, 11);
      if (n > 0.78) tile = 'build-house';
      else if (n > 0.7)  tile = 'build-shop';
      else if (n < 0.2)  tile = 'path';
      else tile = 'floor';
    } else {
      // 外城墙 + 城门
      if (dt < 10.5){
        const angle = Math.atan2(y, x);
        // 四座城门
        const gateAngles = [0, Math.PI/2, Math.PI, -Math.PI/2];
        let isGate = false;
        for (const ga of gateAngles){
          if (Math.abs(angle - ga) < 0.18) { isGate = true; break; }
        }
        if (isGate) tile = 'path';
        else if (Math.abs(dt - 9.5) < 0.6) tile = 'wall';
        else tile = 'floor';
      } else {
        tile = 'grass';
      }
    }
  } else if (scene){
    /* ---- 野外场景 ---- */
    const biome = scene.biome;
    const n1 = noise2(x*0.18, y*0.18, 21);
    const n2 = noise2(x*0.32, y*0.32, 22);
    const n3 = noise2(x*0.09, y*0.09, 23);
    
    // 场景边缘淡出
    const d = Math.hypot(x - scene.cx, y - scene.cy);
    const edge = clamp(1 - (d - scene.radius*0.7) / (scene.radius*0.3), 0, 1);
    
    if (biome === 'plain'){
      if (n3 > 0.90) tile = 'water';
      else if (n1 > 0.80) tile = 'tree';
      else if (n1 < 0.12) tile = 'flower';
      else if (n2 > 0.88)  tile = 'rock';
      else tile = n2 > 0.5 ? 'grass' : 'grass2';
    } else if (biome === 'desert'){
      if (n1 > 0.90) tile = 'rock';
      else if (n1 < 0.05) tile = 'tree'; // 仙人掌用树代替
      else if (n3 > 0.94) tile = 'water';
      else tile = 'sand';
    } else if (biome === 'snow'){
      if (n1 > 0.86) tile = 'tree';
      else if (n2 > 0.91) tile = 'rock';
      else if (n3 > 0.95) tile = 'water';
      else tile = 'snow';
    } else if (biome === 'volcano'){
      if (n3 > 0.88) tile = 'lava';
      else if (n1 > 0.82) tile = 'rock';
      else tile = 'sand'; // 焦土
    } else if (biome === 'coast'){
      if (n3 > 0.82) tile = 'water';
      else if (n1 > 0.88) tile = 'rock';
      else if (n2 > 0.58) tile = 'sand';
      else tile = 'grass';
    } else if (biome === 'forest'){
      if (n1 > 0.68) tile = 'tree';
      else if (n2 > 0.91) tile = 'rock';
      else if (n3 > 0.93) tile = 'water';
      else tile = n2 > 0.45 ? 'grass2' : 'grass';
    }
    // 场景外圈淡出为草地
    if (edge < 1 && hash(x, y, 991) > 0.5) tile = 'grass';
  } else {
    /* ---- 荒野过渡区 ---- */
    const n1 = noise2(x*0.14, y*0.14, 31);
    const n2 = noise2(x*0.3, y*0.3, 32);
    if (n1 > 0.88) tile = 'tree';
    else if (n1 < 0.06) tile = 'water';
    else if (n2 > 0.88) tile = 'rock';
    else if (n2 < 0.2) tile = 'flower';
    else tile = (n2 > 0.5) ? 'grass' : 'grass2';
  }
  
  if(SCENES.some(scene=>x===Math.round(scene.cx)&&y===Math.round(scene.cy)+3))tile='teleport-stone';
  tileCache.set(key, tile);
  if (tileCache.size > TILE_CACHE_LIMIT){
    tileCache.delete(tileCache.keys().next().value);
  }
  return tile;
}

/* 场景装饰图标（随机散落） */
function getDecor(x, y, tile){
  if (tile === 'tree')   return '🌲';
  if (tile === 'rock')   return '🪨';
  if (tile === 'flower') return '🌺';
  if (tile === 'water')  return '';
  if (tile === 'sand' && hash(x,y,88) > 0.9) return '🌵';
  if (tile === 'lava')   return '🔥';
  if (tile === 'snow' && hash(x,y,89) > 0.92) return '❄️';
  return '';
}

/* ================= 判断是否可走 ================= */
function isWalkable(x, y){
  // 严格执行：只有水面不可走，其余所有地形都可走。
  return getTile(x, y) !== 'water';
}

function challengeSceneBoss(sceneId){

/* ================= 野外地图怪物 =================
   怪物直接显示在地图上，不占用碰撞格。
   使用固定哈希，让同一坐标在重绘后仍显示同一种怪物。
*/
function getMapMonster(x, y){
  if (isTown(x, y)) return null;
  if (getTile(x, y) === 'water') return null;

  // 降低野外普通怪物的地图显示密度
  const h = hash(x, y, 701);
  if (h < 0.94) return null;

  const scene = getSceneAt(x, y);
  let pool;
  if (!scene){
    pool = ['lang','shanzei','liukou'];
  } else if (scene.id === 'jiangnan'){
    pool = ['shuyao','chimang','linghu'];
  } else if (scene.id === 'datang'){
    pool = ['shamo','shadao','xieyan'];
  } else if (scene.id === 'beiju'){
    pool = ['xuelang','bingpo','xuenv'];
  } else if (scene.id === 'huoyan'){
    pool = ['huoya','rongyan','yanmo'];
  } else if (scene.id === 'donghai'){
    pool = ['haisha','chaoxi','jiaolong'];
  } else if (scene.id === 'yougu'){
    pool = ['youlu','guteng','guguai'];
  } else {
    pool = ['lang'];
  }

  const index = Math.floor(hash(x, y, 702) * pool.length) % pool.length;
  return MOBS[pool[index]] || null;
}

/* ================= 渲染世界 ================= */
let lastRenderX = null, lastRenderY = null;
let cameraX = 0, cameraY = 0;

function renderWorld(){
  const vw = stage.clientWidth;
  const vh = stage.clientHeight;
  if (!vw || !vh) return;
  
  // 玩家居中：以玩家为中心渲染
  const cols = Math.ceil(vw / TILE) + VIEW_PAD * 2;
  const rows = Math.ceil(vh / TILE) + VIEW_PAD * 2;
  const startX = P.x - Math.floor(cols / 2);
  const startY = P.y - Math.floor(rows / 2);
  
  // 关键修复：让“逻辑坐标”与“屏幕上的格子”严格对齐。
  // 之前格子直接从 0,0 排列，玩家虽然固定在屏幕正中央，但 P.x/P.y 对应的格子
  // 实际并不在玩家脚下，导致画面看着是草地，程序却判断目标格是水。
  const gridLeft = Math.round(vw / 2 - (P.x - startX + 0.5) * TILE);
  const gridTop  = Math.round(vh / 2 - (P.y - startY + 0.5) * TILE);
  
  const frag = document.createDocumentFragment();
  
  for (let dy = 0; dy < rows; dy++){
    for (let dx = 0; dx < cols; dx++){
      const wx = startX + dx;
      const wy = startY + dy;
      const tile = getTile(wx, wy);
      
      const el = document.createElement('div');
      el.className = 'tile t-' + tile;
      el.style.left = (gridLeft + dx * TILE) + 'px';
      el.style.top  = (gridTop + dy * TILE) + 'px';
      el.style.width  = TILE + 'px';
      el.style.height = TILE + 'px';
      
      // 建筑装饰图标
      if (TILE_ICON[tile]){
        const span = document.createElement('span');
        span.className = TILE_ICON[tile].type === 'npc' || TILE_ICON[tile].type === 'shop' ? 'npc' : 'build';
        span.textContent = TILE_ICON[tile].icon;
        el.appendChild(span);
        el.dataset.tileType = tile;
        el.dataset.wx = wx;
        el.dataset.wy = wy;
        el.style.cursor = 'pointer';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          onTileClick(wx, wy, tile);
        });
      } else {
        const deco = getDecor(wx, wy, tile);
        if (deco){
          const span = document.createElement('span');
          span.className = 'deco';
          span.textContent = deco;
          el.appendChild(span);
        }
      }

      // 区域中心 Boss 优先显示；其他位置继续显示原有普通怪物。
      const bossMob = getSceneBossAt(wx, wy);
      const mapMob = bossMob || (tile==='teleport-stone'?null:getMapMonster(wx, wy));
      if (mapMob && (bossMob || !(wx === P.x && wy === P.y))){
        const mobEl = document.createElement('div');
        mobEl.className = bossMob ? 'map-monster map-boss' : 'map-monster';
        mobEl.title = bossMob ? `👑 ${mapMob.name} Lv.${mapMob.lv} · 点击挑战` : `${mapMob.name} Lv.${mapMob.lv}`;
        if (bossMob){
          mobEl.style.pointerEvents = 'auto';
          mobEl.style.cursor = 'pointer';
          mobEl.setAttribute('role','button');
          mobEl.setAttribute('aria-label',`挑战${mapMob.name}`);
          mobEl.addEventListener('click', e => {
            e.preventDefault(); e.stopPropagation();
            const targetScene = SCENES.find(s => Math.round(s.cx) === wx && Math.round(s.cy) === wy);
            if (targetScene) challengeSceneBoss(targetScene.id);
          });
        }
        const img = document.createElement('img');
        img.className = 'map-monster-img';
        img.alt = mapMob.name;
        img.src = makeMonsterImage(mapMob);
        const name = document.createElement('span');
        name.className = 'map-monster-name';
        name.textContent = bossMob ? `👑 ${mapMob.name} Lv.${mapMob.lv}` : `${mapMob.name} Lv.${mapMob.lv}`;
        if (bossMob){
          name.style.color = '#ffe08a';
          name.style.borderColor = '#ffbd45';
          name.style.background = 'rgba(75,12,8,.94)';
        }
        mobEl.appendChild(img);
        mobEl.appendChild(name);
        el.appendChild(mobEl);
      }
      
      frag.appendChild(el);
    }
  }
  
  world.innerHTML = '';
  world.appendChild(frag);
  
  // 玩家角色
  renderPlayer(vw, vh);
  
  // 更新场景标题
  updateSceneTitle();
  
  lastRenderX = P.x;
  lastRenderY = P.y;
}

/* ================= 隐藏区域探索 ================= */
function canEnterRegion(scene){return true;}
function discoverRegion(scene){if(!scene || !scene.hidden || P.discoveredRegions.includes(scene.id))return false;P.discoveredRegions.push(scene.id);showBanner('发现 '+scene.name);addLog('【探索】发现隐藏区域：'+scene.name,'good');toast('🧭 新区域已解锁：'+scene.name);saveGame();return true;}
function unlockTeleportStone(scene){if(!scene||!SCENES.some(x=>x.id===scene.id))return false;if(!Array.isArray(P.teleportStones))P.teleportStones=[];if(P.teleportStones.includes(scene.id))return false;P.teleportStones.push(scene.id);saveGame();toast('🪨 已激活 '+scene.name+' 的传送石碑');addLog('【传送】激活 '+scene.name+' 传送石碑','good');return true;}
function findTeleportLanding(scene){if(!scene)return null;const candidates=[];for(let r=1;r<=6;r++){for(let dy=-r;dy<=r;dy++){for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const x=Math.round(scene.cx)+dx,y=Math.round(scene.cy)+dy;if(getSceneAt(x,y)!==scene||getTile(x,y)==='water'||getTile(x,y)==='teleport-stone'||getSceneBossAt(x,y))continue;candidates.push({x,y,d:Math.hypot(dx,dy)});}}if(candidates.length)break;}candidates.sort((a,b)=>a.d-b.d);return candidates[0]||null;}
function renderTeleportPanel(){const body=$('teleportBody');if(!body)return;body.innerHTML='<p style="color:#cbb58c;font-size:12px;margin:0 0 10px">所有区域均可直接免费传送，不受等级和探索进度限制。</p>'+SCENES.map(scene=>{const current=getSceneAt(P.x,P.y)===scene||scene.id==='changan'&&isTown(P.x,P.y);return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;margin:6px 0;border:1px solid rgba(220,180,90,.5);border-radius:7px;background:rgba(90,60,25,.2)"><div><b style="color:#ffe3a0">🪨 '+scene.name+'</b><div style="font-size:10px;color:#a99a86;margin-top:3px">'+(current?'当前位置':'可直接传送 · 无等级限制')+'</div></div><button class="btn primary" data-teleport-scene="'+scene.id+'" '+(current?'disabled':'')+'>'+(current?'当前位置':'立即传送')+'</button></div>';}).join('');body.querySelectorAll('[data-teleport-scene]').forEach(btn=>btn.addEventListener('click',()=>teleportToScene(btn.dataset.teleportScene)));}
function openTeleportPanel(){if(battle&&battle.active){toast('战斗中无法传送');return;}renderTeleportPanel();openModal('modalTeleport');}
function teleportToScene(sceneId){if(battle&&battle.active){toast('战斗中无法传送');return false;}const scene=SCENES.find(x=>x.id===sceneId);if(!scene){toast('找不到该区域');return false;}const landing=findTeleportLanding(scene);if(!landing){toast('暂时找不到安全的传送落点');return false;}P.x=landing.x;P.y=landing.y;if(scene.hidden)discoverRegion(scene);unlockTeleportStone(scene);syncLocationState();renderWorld();updateHUD();saveGame();closeModal('modalTeleport');showBanner('传送至 '+scene.name);addLog('【传送】抵达 '+scene.name,'good');return true;}

/* ================= 移动系统 ================= */
let moveLock = false;

function tryMove(dx, dy){
  // 地图移动的唯一地形碰撞规则：水面。
  // 战斗界面显示时由战斗界面本身拦截输入；战斗结束后不再使用残留状态锁死地图。
  const battleOverlay = $('battleOverlay');
  if (battleOverlay && battleOverlay.classList.contains('show')) return;

  // 只允许四方向单格移动。
  dx = Math.sign(Number(dx) || 0);
  dy = Math.sign(Number(dy) || 0);
  if (dx === 0 && dy === 0) return;
  if (dx !== 0 && dy !== 0) return;

  const nx = P.x + dx;
  const ny = P.y + dy;
  const targetTile = getTile(nx, ny);
  const targetScene = getSceneAt(nx, ny);
  if(targetScene && targetScene.hidden && !canEnterRegion(targetScene)){toast('🔒 '+targetScene.name+' 尚未开放，需要达到 Lv.'+targetScene.lv+' 才能探索');return;}

  // 唯一碰撞规则：水。
  // grass / grass2 / flower / tree / rock / sand / snow / lava / 建筑等全部允许通行。
  if (targetTile === 'water'){
    toast('🌊 水面无法通行');
    return;
  }
  
  const prevScene = getSceneAt(P.x, P.y);
  
  P.x = nx;
  P.y = ny;
  P.steps++;
  if(targetScene && targetScene.hidden)discoverRegion(targetScene);
  
  // 行走动画
  const pEl = $('player');
  if (pEl){
    pEl.classList.add('walking');
    clearTimeout(pEl._walkTimer);
    pEl._walkTimer = setTimeout(() => pEl.classList.remove('walking'), 300);
  }
  
  renderWorld();
  updateHUD();
  
  // 检查场景切换
  const curScene = getSceneAt(P.x, P.y);
  if (curScene && curScene !== prevScene){
    unlockTeleportStone(curScene);
    showBanner(curScene.name);
    addLog(`【场景】进入 ${curScene.name}（Lv.${curScene.lv}）`, 'dim');
    toast(`📍 ${curScene.name} · ${curScene.desc}`);
  } else if (!curScene && prevScene){
    showBanner('荒野');
    addLog(`【场景】进入荒野地带`, 'dim');
  }
  
  // 步数事件
  onStep(nx, ny);
}

/* ================= 每一步的随机事件 ================= */
function onStep(x, y){
  const scene = getSceneAt(x, y);
  
  // 城镇内不遇敌
  if (isTown(x, y)) return;
  
  // 每 8 步自动回血回蓝
  if (P.steps % 8 === 0){
    if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + Math.floor(P.maxHp * 0.03));
    if (P.mp < P.maxMp) P.mp = Math.min(P.maxMp, P.mp + Math.floor(P.maxMp * 0.05));
    updateHUD();
  }
  
  // 遭遇战改为低频随机触发：至少间隔 14 步，每一步 14% 概率。
  if (P.steps - (Number(P.lastEncounterStep)||0) < 14) return;
  if (Math.random() >= 0.14) return;
  P.lastEncounterStep=P.steps;
  saveGame();
  startEncounter(scene);
}

/* ================= 触发遭遇战 ================= */
function rollEncounterMobCount(level,randomValue){const roll=Number.isFinite(randomValue)?randomValue:Math.random();return Number(level)>=30&&roll<0.06?3:Number(level)>=10&&roll<0.24?2:1;}
function startEncounter(scene){
  // 选择怪物
  let pool;
  if (!scene){
    pool = ['lang', 'shanzei', 'liukou'];
  } else if (scene.id === 'jiangnan'){
    pool = ['shuyao', 'chimang', 'linghu'];
  } else if (scene.id === 'datang'){
    pool = ['shamo', 'shadao', 'xieyan'];
  } else if (scene.id === 'beiju'){
    pool = ['xuelang', 'bingpo', 'xuenv'];
  } else if (scene.id === 'huoyan'){
    pool = ['huoya', 'rongyan', 'yanmo'];
  } else {
    pool = ['lang'];
  }
  
  // 默认单只怪物；中高等级区域才有较低概率出现双怪或三怪。
  const count = rollEncounterMobCount(P.lv);
  const mobs = [];
  for (let i = 0; i < count; i++){
    const id = pool[Math.floor(Math.random() * pool.length)];
    const mob = JSON.parse(JSON.stringify(MOBS[id]));
    // 等级浮动
    const lvOffset = Math.floor(Math.random() * 3) - 1;
    mob.lv = Math.max(1, mob.lv + lvOffset);
    // 属性缩放
    const scale = 1 + (lvOffset * 0.08);
    mob.hp = Math.floor(mob.hp * scale);
    mob.atk = Math.floor(mob.atk * scale);
    mob.maxHp = mob.hp;
    mobs.push(mob);
  }
  
  // 准备战斗
  if (typeof battlePrepare === 'function'){
    battlePrepare(mobs);
  } else {
    toast('⚔️ 遭遇敌人！');
  }
}

/* ================= 点击瓦片交互 ================= */
function onTileClick(wx, wy, tile){
  const info = TILE_ICON[tile];
  if (!info || !info.action) return;
  
  const dist = Math.hypot(wx - P.x, wy - P.y);
  if (dist > 2.2){
    toast('距离太远，请靠近一些');
    return;
  }
  
  // 走到附近
  if (info.action === 'readMemorial'){
    toast('📜 长安石碑：三界同心，共御妖魔');
    addLog('【石碑】三界同心，共御妖魔', 'dim');
  } else if (info.action === 'openShop'){
    openShopPanel();
  } else if(info.action==='openTeleportStone'){
    const scene=getSceneAt(wx,wy);
    if(scene){unlockTeleportStone(scene);openTeleportPanel();}
  }
}

/* ================= 方向键绑定 ================= */
$$('#dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  if (!dir) return;
  let lastMoveAt = 0;
  const move = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const now = Date.now();
    if (now - lastMoveAt < 80) return;
    lastMoveAt = now;
    if (dir === 'up')    tryMove(0, -1);
    if (dir === 'down')  tryMove(0, 1);
    if (dir === 'left')  tryMove(-1, 0);
    if (dir === 'right') tryMove(1, 0);
  };
  btn.addEventListener('click', move);
});

/* 中心按钮：原地休息 */
$('btnCenter').addEventListener('click', () => {
  if (typeof battle !== 'undefined' && battle && battle.active) return;
  const t = getTile(P.x, P.y);
  const inTown = isTown(P.x, P.y);
  const rate = inTown ? 0.08 : 0.04;
  P.hp = Math.min(P.maxHp, P.hp + Math.floor(P.maxHp * rate));
  P.mp = Math.min(P.maxMp, P.mp + Math.floor(P.maxMp * rate * 1.5));
  updateHUD();
  toast(inTown ? '🏠 客栈小憩，气血法力微复' : '· 原地调息');
});

/* 键盘移动 */
const keyMap = {
  'w':'up','W':'up','ArrowUp':'up',
  's':'down','S':'down','ArrowDown':'down',
  'a':'left','A':'left','ArrowLeft':'left',
  'd':'right','D':'right','ArrowRight':'right',
};
document.addEventListener('keydown', e => {
  // 弹窗打开时忽略
  if (document.querySelector('.modal.show')) return;
  if (typeof battle !== 'undefined' && battle && battle.active) return;
  const dir = keyMap[e.key];
  if (!dir) return;
  e.preventDefault();
  if (dir === 'up')    tryMove(0, -1);
  if (dir === 'down')  tryMove(0, 1);
  if (dir === 'left')  tryMove(-1, 0);
  if (dir === 'right') tryMove(1, 0);
});

/* 触摸滑动 */
let touchStartPt = null;
stage.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  touchStartPt = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
}, { passive:true });

stage.addEventListener('touchend', e => {
  if (!touchStartPt) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartPt.x;
  const dy = t.clientY - touchStartPt.y;
  const dist = Math.hypot(dx, dy);
  const dur = Date.now() - touchStartPt.t;
  touchStartPt = null;
  
  if (dist < 24 || dur > 800) return;
  if (typeof battle !== 'undefined' && battle && battle.active) return;
  if (document.querySelector('.modal.show')) return;
  
  if (Math.abs(dx) > Math.abs(dy)){
    tryMove(dx > 0 ? 1 : -1, 0);
  } else {
    tryMove(0, dy > 0 ? 1 : -1);
  }
}, { passive:true });

function blog(text, cls = ''){
  const el = $('battleLog');
  if (!el) return;
  const d = document.createElement('div');
  d.className = 'blog ' + cls;
  d.innerHTML = text;

  while (el.children.length > 80) el.removeChild(el.firstChild);
}

/* ==================== 伤害计算 ==================== */
function calcDamage(attacker, defender, power, type){
  // 攻击方主属性
  const atkStat = (type === 'magic') ? (attacker.magic || attacker.atk) : attacker.atk;
  // 防御减免系数（物理被防御更多减免）
  const defFactor = (type === 'magic') ? 0.4 : 0.7;
  
  const musicBoost = attacker.isPlayer && battle.round <= battle.musicBuffUntilRound ? 1.25 : 1;
  const base = atkStat * power * (0.9 + Math.random() * 0.2) * musicBoost;
  const reduction = defender.def * defFactor;
  let dmg = Math.max(1, base - reduction);
  
  // 暴击
  const crit = Math.random() < 0.12;
  if (crit) dmg *= 1.6;
  
  // 防御姿态减伤50%
  if (defender.guard){
    dmg *= 0.5;
  }

  // 多邻宗【将军】：每层使玩家最终攻击伤害翻倍，最多4层（16倍）。
  const jiangjunMultiplier = attacker.isPlayer && P.sect === 'duolingo'
    ? Math.pow(2, Math.min(4, battle.jiangjunStacks || 0))
    : 1;
  dmg *= jiangjunMultiplier;
  
  return { dmg: Math.floor(dmg), crit };
}

function battleSpriteKey(u){
  if(u.isPlayer)return 'hero';
  if(u.isPet)return ({huahua:'flowerpet',linghu:'fox',hupo:'tigerpet',xiaolong:'dragonpet',jinwu:'birdpet'})[u.petId]||'flowerpet';
  const id=u.mobId||'';
  if(id==='boss_changan'||id==='boss_huoyan')return 'demon';
  if(id==='boss_jiangnan')return 'tree';
  if(id==='boss_datang')return 'golem';
  if(id==='boss_beiju')return 'ice';
  return ({lang:'wolf',shanzei:'bandit',liukou:'bandit',shuyao:'tree',chimang:'snake',linghu:'fox',shamo:'golem',shadao:'archer',xieyan:'fire',xuelang:'wolf',bingpo:'ice',xuenv:'snowwitch',huoya:'crow',rongyan:'lava',yanmo:'demon'})[id]||(u.isEnemy?'golem':'hero');
}
function makeBattleSprite(u){
  const art=BATTLE_PIXEL_ART[battleSpriteKey(u)]||BATTLE_PIXEL_ART.golem;
  const pixels=[];
  for(let y=0;y<art.rows.length;y++)for(let x=0;x<art.rows[y].length;x++){
    const color=art.colors[art.rows[y][x]];
    if(color)pixels.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${color}"/>`);
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 12 12" shape-rendering="crispEdges">${pixels.join('')}</svg>`;
  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}

function battleUnitCard(u){
  const hpPct = clamp(u.hp / u.maxHp * 100, 0, 100);
  const cls = ['battle-unit',u.isPlayer?'is-player':'',u.isPet?'is-pet':'',!u.alive?'dead':'',u.acting?'acting':''].filter(Boolean).join(' ');
  const statusIcons=[];
  if(u.stun&&u.stun>0)statusIcons.push(`<span>💫定身${u.stun}</span>`);
  if(u.guard)statusIcons.push(`<span>🛡️防御</span>`);
  return `
    <div class="${cls}" data-uid="${u.id}">
      <div class="bu-head">
        <div class="bu-icon"><img class="battle-sprite" src="${makeBattleSprite(u)}" alt="${u.name}像素立绘"></div>
        <div class="bu-name">${u.name}${u.lv?`<small>Lv.${u.lv}</small>`:''}</div>
      </div>
      <div class="bu-hp"><div class="fill" style="width:${hpPct}%"></div></div>
      <div class="bu-hp-text">${Math.max(0,Math.ceil(u.hp))}/${u.maxHp}</div>
      ${statusIcons.length?`<div class="bu-status">${statusIcons.join('')}</div>`:''}
    </div>
  `;
}

function renderBattleUnits(){

  enemyRow.innerHTML = battle.units.filter(u => u.isEnemy).map(battleUnitCard).join('');

/* ==================== 战斗主循环 ==================== */
async function battleLoop(token = battle.token){
  if (battle.loopRunning) return;
  battle.loopRunning = true;
  try {
    while (battle.active && token === battle.token && !battle.over && battle.round < 30){
    battle.round++;
    battle.previousRoundDamage=battle.incomingRoundDamage||0; battle.incomingRoundDamage=0;
    
    // 回合提示
    showTurnBanner(`第 ${battle.round} 回合`);
    blog(`—— 第 ${battle.round} 回合 ——`, 'round');
    await sleep(700);
    
    // 清除回合开始状态
    battle.units.forEach(u => u.guard = false);
    
    // 按速度排序
    const order = battle.units
      .filter(u => u.alive)
      .sort((a, b) => (b.spd - a.spd) + (Math.random() - 0.5) * 3);
    
    for (const u of order){
      if (!u.alive || battle.over) continue;
      
      // 定身检查
      if (u.stun > 0){
        u.stun--;
        u.acting = true;
        renderBattleUnits();
        blog(`💫 <b>${u.name}</b> 被定身，无法行动。`, 'dim');
        await sleep(450);
        u.acting = false;
        renderBattleUnits();
        continue;
      }
      
      u.acting = true;
      renderBattleUnits();
      await sleep(200);
      
      if (u.isPlayer){
        await playerTurn(u);
      } else if (u.isPet){
        await petTurn(u);
      } else {
        await monsterTurn(u);
      }
      
      u.acting = false;
      renderBattleUnits();
      checkBattleEnd();
      
      if (battle.over) break;
      await sleep(300);
    }
  }
  
    // 战斗结束后必须进入结算界面
    if (token !== battle.token) return;
    if (battle.over){
      if (battle.fled) finishBattle('flee');
      else if (battle.victory) finishBattle('victory');
      else finishBattle('defeat');
    } else if (battle.active){
      // 超过30回合，平局
      blog('⏳ 战斗超时，双方各自收手。', 'dim');
      battle.over = true;
      finishBattle('draw');
    }
  } finally {
    if (token === battle.token) battle.loopRunning = false;
  }
}

/* ==================== 玩家回合 ==================== */
function playerTurn(unit){
  return new Promise(resolve => {
    if (!battle.active || battle.over || !unit || !unit.alive){
      resolve();
      return;
    }
    const actions = $('battleActions');
    actions.innerHTML = '';
    const duoDock = $('duoSkillDock');
    if (duoDock){
      duoDock.hidden = P.sect !== 'duolingo';
      duoDock.innerHTML = '';
    }

    // 主菜单：攻击 / 技能 / 防御 / 逃跑 / 物品
    const mainMenu = [
      { key:'attack',  name:'普通攻击', icon:'⚔️', cls:'basic' },
      { key:'skill',   name:'施放技能', icon:'✨', cls:'' },
      { key:'item',    name:'使用物品', icon:'🧪', cls:'item' },
      { key:'defend',  name:'防御',     icon:'🛡️', cls:'defend' },
      { key:'flee',    name:'逃跑',     icon:'💨', cls:'flee' },
      { key:'auto',    name:'自动战斗', icon:'🤖', cls:'basic' },
    ];
    
    mainMenu.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'battle-skill ' + m.cls;
      btn.innerHTML = `<span class="bs-name">${m.icon} ${m.name}</span>`;
      btn.addEventListener('click', () => {
        actions.innerHTML = '';
        if (duoDock) duoDock.hidden = true;
        handlePlayerAction(unit, m.key, resolve);
      });
      actions.appendChild(btn);
    });

    if (duoDock && P.sect === 'laomu') renderLaomuSkills(unit,resolve,duoDock);

    // 多邻宗专属的两个战斗快捷键：只在玩家行动阶段出现。
    if (duoDock && P.sect === 'duolingo'){
      const english = document.createElement('button');
      english.className = 'duo-skill-btn';
      english.innerHTML = '<span>📚 学英语</span><small>硬控敌人 1 回合 · 8 法力</small>';
      english.disabled = unit.mp < 8;
      english.addEventListener('click', () => {
        duoDock.hidden = true;
        actions.innerHTML = '';
        useDuolingoShortcut(unit, 'english', resolve);
      });

      const music = document.createElement('button');
      music.className = 'duo-skill-btn music';
      music.innerHTML = '<span>🎵 音乐共鸣</span><small>Lv.5 解锁 · 20 法力</small>';
      music.disabled = P.lv < 5 || unit.mp < 20;
      music.addEventListener('click', () => {
        duoDock.hidden = true;
        actions.innerHTML = '';
        useDuolingoShortcut(unit, 'music', resolve);
      });

      const jiangjun = document.createElement('button');
      jiangjun.className = 'duo-skill-btn jiangjun';
      jiangjun.innerHTML = '<span>⚔️ 将军 ×' + Math.pow(2, battle.jiangjunStacks) + '</span><small>Lv.1 · 10 法力 · 已叠加 ' + battle.jiangjunStacks + '/4 层</small>';
      jiangjun.disabled = unit.mp < 10 || battle.jiangjunStacks >= 4;
      jiangjun.addEventListener('click', () => {
        duoDock.hidden = true;
        actions.innerHTML = '';
        useDuolingoShortcut(unit, 'jiangjun', resolve);
      });
      duoDock.append(english, music, jiangjun);
    }
  });
}

 defs.filter(s=>P.lv>=s.lv).forEach(s=>{const btn=document.createElement('button');btn.className='duo-skill-btn';const remain=Math.max(0,P.laomuCooldownUntil-Date.now());btn.innerHTML='<span>'+s.name+'</span><small>'+s.detail+(s.id==='roll'&&remain?' · 冷却 '+Math.ceil(remain/60000)+'分钟':'')+'</small>';btn.disabled=unit.mp<s.mp||(s.id==='roll'&&remain>0);btn.onclick=()=>{dock.hidden=true;dock.innerHTML='';useLaomuSkill(unit,s.id,resolve);};dock.appendChild(btn);});

function useLaomuSkill(unit,id,resolve){
 const cost={roll:10,sigma:67,eye:20,vanish:100}[id];
 if(!battle.active||battle.over||!unit||!unit.alive){resolve();return;}
 if(unit.mp<cost){blog('法力不足，无法施展此技能。','bad');resolve();return;}
 if(id==='roll'&&Date.now()<P.laomuCooldownUntil){blog('【滚木】仍在冷却中。','dim');resolve();return;}
 const allEnemies=battle.units.filter(u=>u.alive&&u.isEnemy);
 const enemies=id==='vanish'?allEnemies.filter(u=>!u.isBoss&&Number(u.lv||1)<=Number(P.lv||1)):allEnemies;
 if(id==='vanish'&&!enemies.length){blog('🌲【浮木消失术】只能对等级不高于自己的普通敌人使用，Boss与高等级敌人免疫。','warn');resolve();return;}
 if(!enemies.length){resolve();return;}
 const cast=target=>{
  if(id==='vanish'&&(target.isBoss||Number(target.lv||1)>Number(P.lv||1))){blog('目标等级过高或属于 Boss，【浮木消失术】无效！','warn');resolve();return;}
  if(!target||!target.alive){resolve();return;}
  unit.mp-=cost;if(unit.isPlayer)P.mp=unit.mp;
  if(id==='roll'){P.laomuCooldownUntil=Date.now()+3600000;unit.invulnerableUntil=Date.now()+60000;saveGame();blog('🪵【滚木】护体发动！60秒内免疫敌方伤害，冷却60分钟。','good');showDamageFloat(unit.id,'无敌60秒','crit');}
  else if(id==='sigma'){target.hp=Math.max(0,target.hp-67);if(target.hp<=0)target.alive=false;showDamageFloat(target.id,'-67','crit');blog('👊【西格玛滚木拳】造成固定67点伤害！','good');}
  else if(id==='eye'){const dmg=Math.max(0,(battle.previousRoundDamage||0)*2);target.hp=Math.max(0,target.hp-dmg);if(target.hp<=0)target.alive=false;showDamageFloat(target.id,'-'+dmg,'crit');blog('👁️【滚木之眼】上一轮承受伤害×2，造成'+dmg+'点伤害！','good');}
  else if(id==='vanish'){battle.units=battle.units.filter(u=>u!==target);blog('🌲【浮木消失术】使'+target.name+'消失，未计入击杀奖励。','good');}
  renderBattleUnits();updateHUD();setTimeout(resolve,450);
 };
 if(id==='roll')cast(enemies[0]);else if(enemies.length===1)cast(enemies[0]);else showTargetSelect(enemies,resolve,cast);
}
function useDuolingoShortcut(unit, skill, resolve){
  if (!battle.active || battle.over || !unit || !unit.alive) { resolve(); return; }

  if (skill === 'english'){
    if (unit.mp < 8){ blog('法力不足，无法施展【学英语】。','bad'); resolve(); return; }
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    if (!enemies.length){ resolve(); return; }
    const cast = target => {
      if (!target || !target.alive){ resolve(); return; }
      unit.mp -= 8;
      if (unit.isPlayer) P.mp = unit.mp;
      // stun=1：目标下一次行动时跳过本回合，随后自动解除。
      target.stun = Math.max(target.stun || 0, 1);
      blog(`📚 <b>${unit.name}</b> 大喊 “Study English!” 施展【学英语】，<b>${target.name}</b> 被硬控 1 回合！`,'warn');
      showDamageFloat(target.id,'STUN','crit');
      renderBattleUnits();
      updateHUD();
      setTimeout(resolve,450);
    };
    if (enemies.length === 1) cast(enemies[0]);
    else showTargetSelect(enemies,resolve,cast);
    return;
  }

  if (skill === 'jiangjun'){
    if (P.lv < 1){ blog('【将军】需要达到 Lv.1。','dim'); resolve(); return; }
    if (unit.mp < 10){ blog('法力不足，无法施展【将军】。','bad'); resolve(); return; }
    if (battle.jiangjunStacks >= 4){ blog('【将军】已经叠满4层，伤害倍率达到16倍！','good'); resolve(); return; }
    unit.mp -= 10;
    if (unit.isPlayer) P.mp = unit.mp;
    battle.jiangjunStacks++;
    const multiplier = Math.pow(2, battle.jiangjunStacks);
    blog('⚔️ <b>' + unit.name + '</b> 施展【将军】！攻击伤害提升至 <b>' + multiplier + '倍</b>（' + battle.jiangjunStacks + '/4层），持续本场战斗！','good');
    showDamageFloat(unit.id, '伤害×' + multiplier, 'crit');
    renderBattleUnits();
    updateHUD();
    setTimeout(resolve,450);
    return;
  }

  if (skill === 'music'){
    if (P.lv < 5){ blog('【音乐共鸣】需要达到 Lv.5。','dim'); resolve(); return; }
    if (unit.mp < 20){ blog('法力不足，无法奏响【音乐共鸣】。','bad'); resolve(); return; }
    unit.mp -= 20;
    if (unit.isPlayer) P.mp = unit.mp;
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    enemies.forEach(target => {
      const result = calcDamage(unit,target,1.35,'magic');
      target.hp = Math.max(0,target.hp-result.dmg);
      if (target.hp <= 0) target.alive = false;
      shakeUnit(target.id);
      showDamageFloat(target.id,`-${result.dmg}`,result.crit?'crit':'');
      blog(`🎵 【音乐共鸣】的音浪击中 <b>${target.name}</b>，造成 <b>${result.dmg}</b> 点法术伤害。`,'good');
    });
    battle.musicBuffUntilRound = battle.round + 2;
    blog('🎼 灵韵节拍回荡：接下来 2 回合造成的伤害提高 25%！','good');
    renderBattleUnits();
    updateHUD();
    setTimeout(resolve,500);
  }
}

function handlePlayerAction(unit, action, resolve){
  const actions = $('battleActions');
  
  if (action === 'attack'){
    // 选择目标（多个时）
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    if (enemies.length === 1){
      performAttack(unit, enemies[0], 1.0, 'phys', resolve);
    } else {
      showTargetSelect(enemies, resolve, (target) => {
        performAttack(unit, target, 1.0, 'phys', resolve);
      });
    }
  } else if (action === 'skill'){
    showSkillMenu(unit, resolve);
  } else if (action === 'item'){
    showItemMenu(unit, resolve);
  } else if (action === 'defend'){
    // 防御必须明确结束当前玩家回合；使用微任务交接，避免首次战斗时
    // 同步 resolve 与 battleLoop 的渲染/输入状态发生竞争而卡住。
    unit.guard = true;
    blog(`🛡️ <b>${unit.name}</b> 凝神戒备，进入防御姿态。`, 'good');
    renderBattleUnits();
    setTimeout(() => {
      if (battle.active && !battle.over) resolve();
      else resolve();
    }, 0);
  } else if (action === 'flee'){
    if (Math.random() < 0.6){
      battle.over = true;
      battle.fled = true;
      blog('💨 你施展身法，成功脱离了战斗！', 'warn');
    } else {
      blog('❌ 逃跑失败！', 'bad');
    }
    resolve();
  } else if (action === 'auto'){
    // 自动战斗：选最低血敌人普攻
    const enemies = battle.units.filter(u => u.alive && u.isEnemy);
    if (!enemies.length) { resolve(); return; }
    const target = enemies.reduce((a, b) => a.hp < b.hp ? a : b);
    performAttack(unit, target, 1.0, 'phys', resolve);
  }
}

function showSkillMenu(unit, resolve){
  const actions = $('battleActions');
  actions.innerHTML = '';
  
  const skills = getSectSkills();
  
  if (!skills.length){
    blog('你尚未习得任何技能。', 'dim');
    // 重新进入玩家回合
    playerTurn(unit).then(resolve);
    return;
  }
  
  skills.forEach(sk => {
    const canUse = unit.mp >= sk.mp;
    const btn = document.createElement('button');
    btn.className = 'battle-skill' + (canUse ? '' : ' disabled');
    btn.innerHTML = `
      <span class="bs-type">${sk.type === 'magic' ? '法' : sk.type === 'phys' ? '武' : sk.type === 'heal' ? '疗' : '封'}</span>
      <span class="bs-name">${sk.name}</span>
      <span class="bs-mp">${sk.mp} 法力</span>
    `;
    if (canUse){
      btn.addEventListener('click', () => {
        actions.innerHTML = '';
        // 群体技能直接释放
        if (sk.target === 'all' || sk.type === 'heal'){
          unit.mp -= sk.mp;
          applySkill(unit, sk);
          resolve();
        } else {
          // 单体技能选目标
          const enemies = battle.units.filter(u => u.alive && u.isEnemy);
          if (enemies.length === 1){
            unit.mp -= sk.mp;
            applySkill(unit, sk, enemies[0]);
            resolve();
          } else {
            showTargetSelect(enemies, resolve, (t) => {
              unit.mp -= sk.mp;
              applySkill(unit, sk, t);
              resolve();
            });
          }
        }
      });
    }
    actions.appendChild(btn);
  });
  
  const back = document.createElement('button');
  back.className = 'skill-back';
  back.textContent = '← 返回';
  back.addEventListener('click', () => {
    actions.innerHTML = '';
    playerTurn(unit).then(resolve);
  });
  actions.appendChild(back);
}
