      const result = it.use();
      P.bag[id]--;
      if (P.bag[id] <= 0) delete P.bag[id];
      blog(`🧪 <b>${unit.name}</b> 使用了 ${it.icon}${it.name}，${result}`, 'good');
      // 同步战斗单位数据
      unit.hp = P.hp;
      unit.mp = P.mp;
      renderBattleUnits();
      resolve();
    });
    actions.appendChild(btn);
  });
  
  const back = document.createElement('button');
  back.className = 'skill-back';
  back.textContent = '← 返回';
  back.addEventListener('click', () => {
    actions.innerHTML = '';
    playerTurn(unit).then(resolve);
  });
  actions.appendChild(back);
}

/* ==================== 执行攻击 ==================== */
function performAttack(caster, target, power, type, resolve){
  const { dmg, crit } = calcDamage(caster, target, power, type);
  target.hp = Math.max(0, target.hp - dmg);
  
  if (target.hp <= 0){
    target.alive = false;
  }
  
  // 动画
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  const isAlly = caster.isPlayer || caster.isPet;
  const cls = isAlly ? 'good' : 'bad';
  blog(
    `${crit ? '💥' : '⚔️'} <b>${caster.name}</b> 攻击 <b>${target.name}</b>，造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    cls
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  setTimeout(resolve, 350);
}

/* ==================== 应用技能 ==================== */
function applySkill(caster, skill, target){
  // 治疗技能
  if (skill.type === 'heal'){
    const power = skill.power;
    const stat = caster.magic || caster.atk;
    const amount = Math.floor(stat * power * 1.5);
    const before = caster.hp;
    caster.hp = Math.min(caster.maxHp, caster.hp + amount);
    const actual = caster.hp - before;
    if (skill.id === 'jin') caster.guard = true;
    
    // 同步玩家血量
    if (caster.isPlayer){ P.hp = caster.hp; P.mp = caster.mp; }
    
    showDamageFloat(caster.id, `+${actual}`, 'heal');
    blog(`✨ <b>${caster.name}</b> 施展【${skill.name}】，恢复 <b>${actual}</b> 点气血！`, 'good');
    renderBattleUnits();
    return;
  }
  
  // 封印/定身
  if (skill.type === 'debuff'){
    if (!target) return;
    target.stun = (target.stun || 0) + 2;
    blog(`🔒 <b>${caster.name}</b> 施展【${skill.name}】，<b>${target.name}</b> 被定身 2 回合！`, 'warn');
    renderBattleUnits();
    return;
  }
  
  // 攻击技能
  let targets;
  if (skill.target === 'all'){
    targets = battle.units.filter(u => u.alive && (caster.isEnemy ? !u.isEnemy : u.isEnemy));
  } else {
    targets = [target];
  }
  
  targets.forEach(t => {
    if (!t || !t.alive) return;
    const { dmg, crit } = calcDamage(caster, t, skill.power, skill.type);
    t.hp = Math.max(0, t.hp - dmg);
    if (t.hp <= 0) t.alive = false;
    
    shakeUnit(t.id);
    showDamageFloat(t.id, `-${dmg}`, crit ? 'crit' : '');
    
    const isAlly = caster.isPlayer || caster.isPet;
    blog(
      `${crit ? '💥' : '✨'} <b>${caster.name}</b> 施展【${skill.name}】，对 <b>${t.name}</b> 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
      isAlly ? 'good' : 'bad'
    );
    
    if (!t.alive){
      blog(`☠️ <b>${t.name}</b> 倒下了！`, 'warn');
    }
  });
  
  // 普度众生：攻击同时回血
  if (skill.id === 'pu'){
    const healAmt = Math.floor((caster.magic || caster.atk) * 0.8);
    caster.hp = Math.min(caster.maxHp, caster.hp + healAmt);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `+${healAmt}`, 'heal');
    blog(`💚 <b>${caster.name}</b> 同时恢复了 <b>${healAmt}</b> 点气血。`, 'good');
  }
  
  // 破釜沉舟：自损
  if (skill.id === 'po'){
    const selfDmg = Math.floor(caster.hp * 0.1);
    caster.hp = Math.max(1, caster.hp - selfDmg);
    if (caster.isPlayer){ P.hp = caster.hp; }
    showDamageFloat(caster.id, `-${selfDmg}`, '');
    blog(`💔 <b>${caster.name}</b> 燃烧气血，自损 <b>${selfDmg}</b> 点。`, 'dim');
  }
  
  renderBattleUnits();
}

/* ==================== 召唤兽回合 ==================== */
async function petTurn(unit){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  if (!enemies.length) return;
  const target = enemies.reduce((a, b) => a.hp < b.hp ? a : b);
  
  blog(`🐾 <b>${unit.name}</b> 扑向 <b>${target.name}</b>！`);
  await sleep(250);
  
  const { dmg, crit } = calcDamage(unit, target, 1.0, 'phys');
  target.hp = Math.max(0, target.hp - dmg);
  if (target.hp <= 0) target.alive = false;
  
  shakeUnit(target.id);
  showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
  
  blog(
    `${crit ? '💥' : '🐾'} 造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`,
    'good'
  );
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'warn');
  }
  
  renderBattleUnits();
  await sleep(300);
}

/* ==================== 怪物回合 ==================== */
async function monsterTurn(unit){
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  if (!allies.length) return;
  
  const vulnerable=allies.filter(a=>!(a.isPlayer&&a.invulnerableUntil>Date.now()));
  if(!vulnerable.length){blog('🪵【滚木】护体生效，敌方攻击无法伤害你！','good');await sleep(250);return;}
  const target = vulnerable.reduce((a, b) => a.hp < b.hp ? a : b);
  
  // 怪物偶尔使用技能
  if (unit.skills && unit.skills.length && Math.random() < 0.3){
    const sk = unit.skills[Math.floor(Math.random() * unit.skills.length)];
    const { dmg } = calcDamage(unit, target, sk.power || 1.3, sk.type || 'magic');
    target.hp = Math.max(0, target.hp - dmg);
    if (target.hp <= 0) target.alive = false;
    
    if(target.isPlayer) battle.incomingRoundDamage+=dmg;
    shakeUnit(target.id);
    showDamageFloat(target.id, `-${dmg}`, '');
    blog(`😈 <b>${unit.name}</b> 施展【${sk.name}】，对 <b>${target.name}</b> 造成 <b>${dmg}</b> 点伤害`, 'bad');
  } else {
    const { dmg, crit } = calcDamage(unit, target, 1.0, 'phys');
    target.hp = Math.max(0, target.hp - dmg);
    if (target.hp <= 0) target.alive = false;
    
    if(target.isPlayer) battle.incomingRoundDamage+=dmg;
    shakeUnit(target.id);
    showDamageFloat(target.id, `-${dmg}`, crit ? 'crit' : '');
    blog(`👹 <b>${unit.name}</b> 攻击 <b>${target.name}</b>，造成 <b>${dmg}</b> 点伤害${crit ? '（暴击！）' : ''}`, 'bad');
  }
  
  if (!target.alive){
    blog(`☠️ <b>${target.name}</b> 倒下了！`, 'bad');
  }
  
  renderBattleUnits();
  await sleep(350);
}

/* ==================== 检查战斗结束 ==================== */
function checkBattleEnd(){
  const enemies = battle.units.filter(u => u.alive && u.isEnemy);
  const allies = battle.units.filter(u => u.alive && !u.isEnemy);
  
  if (enemies.length === 0){
    battle.over = true;
    battle.victory = true;
  } else if (allies.length === 0){
    battle.over = true;
    battle.victory = false;
  }
}

/* ==================== 战斗结算 ==================== */
function finishBattle(result){
  // 先解除战斗状态，确保结算界面出现后地图不会被旧状态锁死。
  battle.active = false;
  battle.over = true;
  
  const playerUnit = battle.units.find(u => u.isPlayer);
  const petUnit = battle.units.find(u => u.isPet);
  
  // 同步玩家状态
  if (playerUnit){
    P.hp = Math.max(1, playerUnit.hp);
    P.mp = playerUnit.mp;
  }
  if (petUnit && P.pet){
    P.pet.hp = Math.max(1, Math.floor(P.pet.maxHp * 0.2));
  }
  
  const duoDock = $('duoSkillDock');
  if (duoDock) duoDock.hidden = true;
  const banner = $('resultBanner');
  banner.innerHTML = '';
  
  if (result === 'flee' || battle.fled){
    banner.innerHTML = `
      <div class="rb-title win" style="color:#80d0ff;text-shadow:3px 3px 0 #000,0 0 30px rgba(128,208,255,.9)">脱 离</div>
      <div class="rb-info">你成功脱离了战斗</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (result === 'draw'){
    banner.innerHTML = `
      <div class="rb-title" style="color:#c0a0e8">平 局</div>
      <div class="rb-info">战斗超时，双方各自收手</div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
  } else if (battle.victory){
    // 计算奖励
    let exp = 0, gold = 0;
    battle.units.filter(u => u.isEnemy).forEach(m => {
      exp += m.exp || 30;
      gold += m.gold || 15;
    });
    
    // 加成
    const bonus = 1 + P.lv * 0.05;
    exp = Math.floor(exp * bonus);
    gold = Math.floor(gold * bonus);
    
    P.gold += gold;
    if(!battle.immortalV2)P.battles++;
    if(!battle.immortalV2)P.kills = (P.kills || 0) + battle.units.filter(u => u.isEnemy && !u.alive).length;
    if (!battle.immortalV2 && (!P.killStats || typeof P.killStats !== 'object')) P.killStats = {};
    if(!battle.immortalV2)battle.units.filter(u=>u.isEnemy&&!u.alive).forEach(u=>{
 P.killStats[u.mobId||u.name]=(P.killStats[u.mobId||u.name]||0)+1;
 if(u.mobId&&u.mobId.startsWith('boss_')&&!P.bossDrops[u.mobId]){const b=CULTIVATION_BOOKS.find(x=>x.boss===u.mobId);if(b){P.cultivationBooks.push(b.id);P.bossDrops[u.mobId]=true;toast('Boss掉落功法：'+b.name);addLog('获得功法 '+b.name,'good');}}
});
    if(!battle.immortalV2)gainExp(exp);
    
    banner.innerHTML = `
      <div class="rb-title win">胜 利</div>
      <div class="rb-info">
        获得经验 <b>+${fmt(exp)}</b><br>
        获得银两 <b>+${fmt(gold)}</b>
      </div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
    
    addLog(`【战斗】胜利！经验 +${exp}，银两 +${gold}`, 'good');
  } else {
    const lost = battle.immortalV2 ? 0 : Math.floor(P.gold * 0.1);
    P.gold = Math.max(0, P.gold - lost);
    P.hp = Math.max(1, Math.floor(P.maxHp * 0.25));
    P.mp = Math.max(0, Math.floor(P.maxMp * 0.3));
    
    banner.innerHTML = `
      <div class="rb-title lose">战 败</div>
      <div class="rb-info">
        你被击倒在地……<br>
        损失银两 <b>${fmt(lost)}</b> 两
      </div>
      <button class="rb-btn" id="rbOk">继 续</button>
    `;
    
    addLog(`【战斗】战败，损失 ${lost} 两`, 'bad');
  }
  
  banner.classList.add('show');
  
  // 绑定继续按钮
  setTimeout(() => {
    const okBtn = $('rbOk');
    if (okBtn){
      okBtn.addEventListener('click', () => {
        closeBattleUI();
      });
    }
  }, 50);
  
  updateHUD();
}

function closeBattleUI(){
  // 彻底清理战斗锁与当前回合状态。
  battle.token++;
  battle.loopRunning = false;
  battle.active = false;
  battle.over = true;
  battle.victory = false;
  battle.fled = false;
  const overlay = battle.overlay;
  if (overlay){
    overlay.classList.add('fading');
    setTimeout(() => {
      overlay.classList.remove('show');
      overlay.classList.remove('fading');
      $('resultBanner').classList.remove('show');
    }, 300);
  }
  battle.units = [];
  battle.round = 0;
  if(worldOpen){openWorld();}else{renderWorld();}
}

let shopTab = 'buy';
let shopSelectedItem = null;

function openShopPanel(){
  // 检查是否在长安城范围内
  if (!isTown(P.x, P.y)){
    toast('坊市只在长安城内开放');
    return;
  }
  
  // 动态创建商店弹窗
  let modal = $('modalShop');
  if (!modal){
    modal = document.createElement('div');
    modal.className = 'modal';
    modal.id = 'modalShop';
    modal.innerHTML = `
      <div class="dialog">
        <div class="dialog-head">
          <div class="dialog-title">坊 市</div>
          <button class="dialog-close" data-close="modalShop">✕</button>
        </div>
        <div class="dialog-body" id="shopBody"></div>
        <div class="dialog-foot">
          <button class="btn primary" data-close="modalShop">离 开</button>
        </div>
      </div>
    `;
    document.getElementById('game').appendChild(modal);
    
    // 绑定关闭
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('show');
    });
    modal.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', () => modal.classList.remove('show'));
    });
  }

function renderShopPanel(){
  const body = $('shopBody');
  if (!body) return;
  
  body.innerHTML = `
    <div style="display:flex;gap:4px;margin-bottom:12px">
      <button class="btn small ${shopTab==='buy'?'primary':''}" data-stab="buy" style="flex:1">购 买</button>
      <button class="btn small ${shopTab==='sell'?'primary':''}" data-stab="sell" style="flex:1">出 售</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:6px 10px;background:linear-gradient(180deg,rgba(240,200,96,.12),transparent);border:1.5px solid rgba(240,200,96,.3);border-radius:6px">
      <span style="font-size:11px;color:#c0a870">💰 你的银两</span>
      <span style="font-size:13px;color:#ffd060;font-weight:bold;text-shadow:0 1px 0 #000">${fmt(P.gold)} 两</span>
    </div>
    <div id="shopItems"></div>
  `;
  
  body.querySelectorAll('[data-stab]').forEach(btn => {
    btn.addEventListener('click', () => {
      shopTab = btn.dataset.stab;
      renderShopPanel();
    });
  });
  
  const list = body.querySelector('#shopItems');
  
  if (shopTab === 'buy'){
    renderBuyList(list);
  } else {
    renderSellList(list);
  }
}

function renderBuyList(list){
  // 商店出售的药品
  const buyables = ['hp1', 'hp2', 'hp3', 'mp1', 'mp2', 'exp1', 'exp2', 'stone1', 'stone2', 'stone3'];
  
  buyables.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    const rare = it.rare || 0;
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}</div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#ffd060">${fmt(it.price)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '购买';
    btn.disabled = P.gold < it.price;
    btn.addEventListener('click', () => {
      if (P.gold < it.price) return;
      // 检查背包空间
      const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
      if (keys.length >= 20 && !P.bag[id]){
        toast('背包已满');
        return;
      }
      P.gold -= it.price;
      P.bag[id] = (P.bag[id] || 0) + 1;
      toast(`🛒 购入 ${it.icon}${it.name}`);
      addLog(`【购买】${it.name} 花费 ${it.price} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

function renderSellList(list){
  const keys = Object.keys(P.bag).filter(k => P.bag[k] > 0);
  
  if (!keys.length){
    list.innerHTML = '<div class="empty-tip"><span class="ei">🎒</span>背包中没有可出售的物品</div>';
    return;
  }
  
  keys.forEach(id => {
    const it = ITEMS[id];
    if (!it) return;
    // 出售价为原价 50%
    const sellPrice = Math.floor((it.price || 0) * 0.5);
    const rare = it.rare || 0;
    
    const itEl = document.createElement('div');
    itEl.className = 'list-item' + (rare>=1?` rare-${rare}`:'');
    itEl.innerHTML = `
      <div class="li-icon" style="font-size:22px">${it.icon}</div>
      <div class="li-body">
        <div class="li-name">${it.name}<span class="li-count">×${P.bag[id]}</span></div>
        <div class="li-desc">${it.desc}</div>
      </div>
      <div class="li-right" style="color:#80ffa0">+${fmt(sellPrice)}<small>两</small></div>
    `;
    const btn = document.createElement('button');
    btn.className = 'li-btn';
    btn.textContent = '出售';
    btn.disabled = sellPrice <= 0;
    btn.addEventListener('click', () => {
      if (sellPrice <= 0) return;
      P.gold += sellPrice;
      P.bag[id]--;
      if (P.bag[id] <= 0) delete P.bag[id];
      toast(`💰 出售 ${it.icon}${it.name}，获得 ${sellPrice} 两`);
      addLog(`【出售】${it.name} 获得 ${sellPrice} 两`, 'good');
      updateHUD();
      renderShopPanel();
    });
    itEl.appendChild(btn);
    list.appendChild(itEl);
  });
}

   第 8 批：初始化 / 游戏主循环 / 存档系统
   ============================================================ */

const SAVE_KEY = 'mhxy_single_player_save_v1';
let gameLoopTimer = null;
let cultivationTimer=null;

/* 保存游戏 */
function saveGame(){
  try{
    const data = getSaveData();
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(err){
    console.warn('保存游戏失败：', err);
    return false;
  }
}

function getSaveData(){
  return {
    name:P.name, sect:P.sect, avatar:P.avatar, lv:P.lv, exp:P.exp,
    hp:P.hp, maxHp:P.maxHp, mp:P.mp, maxMp:P.maxMp,
    atk:P.atk, def:P.def, spd:P.spd, magic:P.magic,
    gold:P.gold, x:P.x, y:P.y, scene:P.scene, subScene:P.subScene,
    bag:P.bag, pet:P.pet, petBox:P.petBox, steps:P.steps, cultivationBooks:P.cultivationBooks, cultivationActive:P.cultivationActive, cultivationProgressMs:P.cultivationProgressMs, bossDrops:P.bossDrops, laomuCooldownUntil:P.laomuCooldownUntil, flags:P.flags,
    battles:P.battles, kills:P.kills, killStats:P.killStats, bankGold:P.bankGold,
    logs:Array.isArray(P.logs) ? P.logs.slice(-50) : []
  };
}

function applySaveData(data){
  if (!data || typeof data !== 'object' || Array.isArray(data)) return false;

  const allowed = [
    'name','sect','avatar','lv','exp','hp','maxHp','mp','maxMp',
    'atk','def','spd','magic','gold','x','y','scene','subScene',
    'bag','pet','petBox','steps','battles','kills','killStats','bankGold','logs','cultivationBooks','cultivationActive','cultivationProgressMs','bossDrops','laomuCooldownUntil','flags'
  ];
  allowed.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(data, key)) P[key] = data[key];
  });
  P.avatar = P.avatar === 'frog' ? 'frog' : 'original';

  /* 防止旧存档或手工修改造成非法数值 */
  P.lv = Math.max(1, Number(P.lv) || 1);
  P.exp = Math.max(0, Number(P.exp) || 0);
  P.maxHp = Math.max(1, Number(P.maxHp) || 100);
  P.maxMp = Math.max(1, Number(P.maxMp) || 50);
  P.hp = clamp(Number(P.hp) || P.maxHp, 0, P.maxHp);
  P.mp = clamp(Number(P.mp) || P.maxMp, 0, P.maxMp);
  P.gold = Math.max(0, Number(P.gold) || 0);
  P.x = Number.isFinite(Number(P.x)) ? Number(P.x) : 0;
  P.y = Number.isFinite(Number(P.y)) ? Number(P.y) : 0;
  P.steps = Math.max(0, Number(P.steps) || 0);
  P.battles = Math.max(0, Number(P.battles) || 0);
  P.kills = Math.max(0, Number(P.kills) || 0);
  P.bankGold = Math.max(0, Number(P.bankGold) || 0);
  if (!P.killStats || typeof P.killStats !== 'object') P.killStats = {};
  if (!P.bag || typeof P.bag !== 'object') P.bag = {};
  if (!Array.isArray(P.petBox)) P.petBox = [];
  if (!Array.isArray(P.logs)) P.logs = [];
  if (!Array.isArray(P.cultivationBooks)) P.cultivationBooks=[];
  if (!P.bossDrops || typeof P.bossDrops!=='object') P.bossDrops={};
  if (!P.flags || typeof P.flags!=='object') P.flags={};
  P.cultivationProgressMs=Math.max(0,Number(P.cultivationProgressMs)||0);
  P.laomuCooldownUntil=Math.max(0,Number(P.laomuCooldownUntil)||0);

  return Boolean(P.sect);
}

/* 读取存档 */
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    return applySaveData(data);
  }catch(err){
    console.warn('读取存档失败：', err);
    return false;
  }
}

/* 清除存档 */
function clearSave(){
  try{
    localStorage.removeItem(SAVE_KEY);
    return true;
  }catch(err){
    console.warn('清除存档失败：', err);
    return false;
  }
}

/* 游戏主循环：负责定时刷新 HUD，并自动保存 */
function startGameLoop(){
  if (gameLoopTimer) clearInterval(gameLoopTimer);
  if(cultivationTimer)clearInterval(cultivationTimer);cultivationTimer=setInterval(tickCultivation,1000);

  updateHUD();
  renderWorld();

  gameLoopTimer = setInterval(() => {
    if (battle && battle.active) return;

    /* 非战斗状态下缓慢恢复，避免数值溢出 */
    if (P.hp < P.maxHp) P.hp = Math.min(P.maxHp, P.hp + 1);
    if (P.mp < P.maxMp) P.mp = Math.min(P.maxMp, P.mp + 1);

    updateHUD();
    saveGame();
  }, 5000);

  saveGame();
}

});

window.addEventListener('pagehide', saveGame);

/* 游戏初始化 */
function initGame(){
  const hasSave = loadGame();

  updateHUD();

  if (hasSave && P.sect && SECTS.some(s => s.id === P.sect)){
    $('modalSect').classList.remove('show');
    renderWorld();
    startGameLoop();
    toast('💾 已读取上次游戏进度');
    return;
  }

  /* 没有有效存档时进入门派选择 */
  P.sect = null;
  renderSectSelect();
  $('modalSect').classList.add('show');
}

/* 响应式重绘：设备旋转、浏览器地址栏收起/展开、窗口尺寸变化时重新计算地图 */
(function responsiveLayout(){
  let raf = 0;
  function refreshLayout(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      document.documentElement.style.setProperty('--vw', `${window.innerWidth}px`);
      document.documentElement.style.setProperty('--vh', `${window.innerHeight}px`);
      if (typeof P !== 'undefined' && P.sect && typeof renderWorld === 'function') {
        renderWorld();
      }
    });
  }
  window.addEventListener('resize', refreshLayout, {passive:true});
  window.addEventListener('orientationchange', () => setTimeout(refreshLayout, 120), {passive:true});
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', refreshLayout, {passive:true});
  }
  refreshLayout();
})();


/* ================= 最终屏幕尺寸同步 ================= */
(function(){
  let resizeTimer = 0;
  function syncViewport(){
    document.documentElement.style.setProperty('--vw', window.innerWidth + 'px');
    document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
    const g = document.getElementById('game');
    if (g){
      g.style.width = '100vw';
      g.style.maxWidth = '100vw';
      g.style.height = '100dvh';
    }
    if (typeof renderWorld === 'function') renderWorld();
  }
  function schedule(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncViewport, 80);
  }
  window.addEventListener('resize', schedule, {passive:true});
  window.addEventListener('orientationchange', schedule, {passive:true});
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', schedule, {passive:true});
  }
  syncViewport();
})();

    const scroller=body.firstElementChild;requestAnimationFrame(()=>{if(scroller){scroller.scrollLeft=Math.max(0,px-scroller.clientWidth/2);scroller.scrollTop=Math.max(0,py-scroller.clientHeight/2);}});

  };

  /* ---------- 钱庄：原界面已有“钱庄”图标，现在真正可用 ---------- */
  TILE_ICON['build-shop'].action = 'openBank';

  window.openBankPanel = function(){
    let modal = $('modalBank');
    if (!modal){
      modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'modalBank';
      modal.innerHTML = `
        <div class="dialog">
          <div class="dialog-head">
            <div class="dialog-title">钱 庄</div>
            <button class="dialog-close" data-close="modalBank">✕</button>
          </div>
          <div class="dialog-body" id="bankBody"></div>
          <div class="dialog-foot">
            <button class="btn primary" data-close="modalBank">离 开</button>
          </div>
        </div>
      `;
      $('game').appendChild(modal);
    }

    const body = $('bankBody');
    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box gold"><span class="sk"><span class="ski">💰</span>身上银两</span><span class="sv">${fmt(P.gold)}</span></div>
        <div class="stat-box"><span class="sk"><span class="ski">🏦</span>钱庄存款</span><span class="sv">${fmt(P.bankGold)}</span></div>
      </div>
      <div class="section-title"><span class="sti">🏦</span>存取银两</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">

        <button class="btn" id="bankWithdrawAll">全部取出</button>
      </div>
    `;

    const refresh = () => openBankPanel();
    $('bankDeposit100').onclick = () => {
      if (P.gold < 100){ toast('银两不足'); return; }
      P.gold -= 100; P.bankGold += 100; saveGame(); updateHUD(); refresh();
    };
    $('bankDepositAll').onclick = () => {
      if (P.gold <= 0){ toast('身上没有银两'); return; }
      P.bankGold += P.gold; P.gold = 0; saveGame(); updateHUD(); refresh();
    };
    $('bankWithdraw100').onclick = () => {
      if (P.bankGold < 100){ toast('钱庄余额不足'); return; }
      P.bankGold -= 100; P.gold += 100; saveGame(); updateHUD(); refresh();
    };
    $('bankWithdrawAll').onclick = () => {
      if (P.bankGold <= 0){ toast('钱庄没有存款'); return; }
      P.gold += P.bankGold; P.bankGold = 0; saveGame(); updateHUD(); refresh();

    modal.classList.add('show');
  };

  /* ---------- 瓦片交互：增加钱庄 ---------- */
  const _onTileClick = onTileClick;
  onTileClick = function(wx, wy, tile){
    const info = TILE_ICON[tile];
    if (info && info.action === 'openBank'){
      const dist = Math.hypot(wx - P.x, wy - P.y);
      if (dist > 2.2){ toast('距离太远，请靠近一些'); return; }
      openBankPanel();
      return;
    }
    _onTileClick(wx, wy, tile);

      const left = parseFloat(tileEl.style.left) || 0;

      const wy = P.y + Math.round((top + TILE / 2 - stage.clientHeight / 2) / TILE);
      const mob = getMapMonster(wx, wy);
      if (!mob || isTown(wx, wy)) return;
      e.preventDefault();
      e.stopPropagation();
      const clone = JSON.parse(JSON.stringify(mob));
      clone.maxHp = clone.hp;
      battlePrepare([clone]);
    });

  /* ---------- 召唤兽仓库：保留已有 petBox 数据并允许收纳/切换 ---------- */
  const oldRenderPetPanel = renderPetPanel;
  renderPetPanel = function(){
    oldRenderPetPanel();

    const body = $('petBody');
    if (!body || body.querySelector('#petStorage')) return;

    const storage = document.createElement('div');
    storage.id = 'petStorage';
    storage.style.cssText = 'margin-top:14px;padding:10px;border:1.5px solid rgba(240,200,96,.25);border-radius:7px;background:rgba(0,0,0,.12)';
    storage.innerHTML = `
      <div style="color:#ffe8a0;font-weight:bold;letter-spacing:2px;margin-bottom:7px">📦 召唤兽仓库</div>
      <div style="font-size:10px;color:#c0a870;margin-bottom:8px">已存放 ${P.petBox.length} / 6 只</div>
      <div id="petStorageList"></div>
    `;

    const list = storage.querySelector('#petStorageList');

    if (P.pet){
      const storeBtn = document.createElement('button');
      storeBtn.className = 'btn small';
      storeBtn.style.width = '100%';
      storeBtn.textContent = '📥 将当前召唤兽收进仓库';
      storeBtn.disabled = P.petBox.length >= 6;
      storeBtn.onclick = () => {
        if (!P.pet || P.petBox.length >= 6) return;
        P.petBox.push(P.pet);
        P.pet = null;
        saveGame();
        toast('📦 召唤兽已收进仓库');
        renderPetPanel();
      };
      list.appendChild(storeBtn);
    }

    P.petBox.forEach((pet, index) => {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.style.marginTop = '6px';
      row.innerHTML = `
        <div class="li-icon" style="font-size:24px">${pet.icon}</div>
        <div class="li-body">
          <div class="li-name">${pet.name}</div>
          <div class="li-desc">❤️${Math.ceil(pet.hp)}/${pet.maxHp} · 🗡️${pet.atk} · 🛡️${pet.def}</div>
        </div>
      `;
      const out = document.createElement('button');
      out.className = 'li-btn';
      out.textContent = '出仓';
      out.onclick = () => {
        const storedPet = P.petBox[index];
        if (!storedPet) return;
        if (P.pet) {
          P.petBox[index] = P.pet;
        } else {
          P.petBox.splice(index, 1);
        }
        P.pet = storedPet;
        saveGame();
        toast(`🐾 ${P.pet.name} 已出战`);
        renderPetPanel();
      };
      row.appendChild(out);
      list.appendChild(row);
    });

    body.appendChild(storage);
  };

  /* ---------- 初始化新字段，兼容旧存档 ---------- */
  P.kills = Math.max(0, Number(P.kills) || 0);
  if (!P.kills && P.battles) P.kills = P.battles;
  P.bankGold = Math.max(0, Number(P.bankGold) || 0);
  if (!P.killStats || typeof P.killStats !== 'object') P.killStats = {};
  if (!Array.isArray(P.petBox)) P.petBox = [];

  saveGame();
})();

</script>

 const mob={id:'immortal_'+(bossId||String(type)),name:foe.name,icon:foe.icon||'👾',lv:Math.max(1,V2.immortal.level),hp:Math.max(1,foe.hp||100),maxHp:Math.max(1,foe.hp||100),atk:Math.max(1,foe.atk||10),def:Math.max(0,foe.def||0),spd:foe.spd||12,magic:foe.atk||10,exp:0,gold:0,skills:[]};
 battle.immortalV2={type,bossId,enemyName:foe.name};worldTarget=null;worldKeys={};battlePrepare([mob]);
}
function showBattle(){
 ensureRoot();$v('v2Root').classList.add('open');$v('v2Title').textContent='仙界战斗';
 $v('v2Tabs').style.display='none';$v('v2Body').style.padding='12px';$v('v2Body').style.overflow='auto';
 const e=battleV2.enemy;
 $v('v2Body').innerHTML=card(e.name,'<div style="font-size:30px;text-align:center">⚔️</div><div class="v2-row"><span>敌方气血</span><b>'+Math.max(0,Math.ceil(e.hp))+'</b></div><div class="v2-progress"><i style="width:'+Math.max(0,e.hp/(e.maxHp||e.hp)*100)+'%"></i></div><div class="v2-row"><span>你的气血</span><b>'+Math.ceil(P.hp)+' / '+P.maxHp+'</b></div><div class="v2-row"><span>你的法力</span><b>'+Math.ceil(P.mp)+' / '+P.maxMp+'</b></div><div class="v2-grid">'+btn('普通攻击','attack','blue')+btn('仙术攻击（耗20法力）','spell')+btn('恢复气血（耗药品/或撤退）','heal')+btn('撤退','flee','red')+'</div><h3 style="margin-top:12px">战斗记录</h3><div class="v2-battle-log" id="v2BattleLog">'+battleV2.log.join('<br>')+'</div>');
 $v('v2Body').querySelectorAll('[data-v2-action]').forEach(b=>b.onclick=()=>battleAction(b.dataset.v2Action));
}
function battleAction(a){
 if(!battleV2)return;
 const e=battleV2.enemy;
 if(a==='flee'){battleV2=null;if(worldOpen){openWorld();}else{closePanel();renderPanel();}toast('已撤离战斗');return;}
 if(a==='heal'){const heal=Math.min(P.maxHp-P.hp,Math.floor(P.maxHp*.28));if(heal<=0){toast('气血充足');return;}P.hp+=heal;battleV2.log.push('你恢复了 '+heal+' 点气血');}
 else if(a==='spell'){if(P.mp<20){toast('法力不足');return;}P.mp-=20;e.hp-=Math.max(20,Math.floor(P.magic*2.1+V2.immortal.level*14-e.def*.35));battleV2.log.push('仙术命中！');}
 else{e.hp-=Math.max(8,Math.floor(P.atk+V2.immortal.level*9-e.def*.55));battleV2.log.push('你发动攻击。');}
 if(e.hp<=0){winBattle();return;}
 const phase=e.hp<(e.maxHp||e.hp)*.5?1:0;
 if(phase!==e.phase){e.phase=phase;e.atk=Math.floor(e.atk*1.18);battleV2.log.push('敌人进入第二阶段，攻势增强！');}
 const dmg=Math.max(1,Math.floor(e.atk*(phase?1.15:1)-P.def*.38));
 if(!V2.immortal.unlocked&&battleV2.type==='tribulation')P.hp=Math.max(1,P.hp-dmg);
 else P.hp=Math.max(0,P.hp-dmg);
 battleV2.log.push(e.name+'对你造成 '+dmg+' 点伤害。');battleV2.round++;
 if(P.hp<=0){P.hp=Math.max(1,Math.floor(P.maxHp*.25));battleV2.log.push('你被击退，恢复部分气血后退出战斗。');battleV2.type='defeat';}
 if(battleV2.type==='defeat'){battleV2=null;saveV2();toast('挑战失败，可以重新挑战');if(worldOpen){openWorld();}else renderPanel();return;}
 showBattle();saveV2();
}
function winBattle(){
 const b=battleV2,kind=b.type,enemy=b.enemy;
 if(kind==='tribulation'){
  V2.ascension.tribulations++;
  log('成功渡过第'+V2.ascension.tribulations+'重天劫');
  battleV2=null;
  if(V2.ascension.tribulations>=3){toast('三重天劫已过！最终天劫已现身');}
  else toast('渡劫成功！');
  saveV2();currentTab='overview';renderPanel();return;
 }
 if(kind.startsWith('immortal:')){
  const id=kind.slice(9),boss=IMMORTAL_BOSSES.find(x=>x.id===id);
  if(boss&&!V2.world.bossKills[id]){
   V2.world.bossKills[id]=true;V2.materials.仙玉+=500;V2.materials.仙晶+=40;
   const loot=boss.drop;V2.materials[loot]=(V2.materials[loot]||0)+1;
   const region=REGIONS.find(x=>x.id===boss.region);
   if(region&&boss.region==='lingxiao')grantItem('relic_emperor');
   if(boss.region==='nantian')grantItem('sword_cloud');
   if(boss.region==='yaochi')grantItem('helm_star');
   if(boss.region==='wanshan')grantItem('armor_mist');
   if(boss.region==='bingyu')grantItem('boots_wind');
   if(boss.region==='jiuyou')grantItem('ring_sun');
   log('首通仙界Boss '+boss.name+'，获得 '+loot+' 与仙玉、仙晶');
   toast('首通奖励：'+loot);
   V2.world.unlocked.push(boss.region);
  }else{V2.materials.仙玉+=100;V2.materials.灵石+=1;toast('再次击败Boss，获得仙玉与灵石');}
 }else{
  V2.materials.仙玉+=25+Math.floor(Math.random()*35);V2.immortal.exp+=80+V2.immortal.level*15;
  V2.immortal.spiritPower+=2;
  levelImmortal();
 }
 battleV2=null;P.hp=P.maxHp;P.mp=P.maxMp;saveV2();
 if(worldOpen){openWorld();}
 else{currentTab='overview';renderPanel();}
}
function levelImmortal(){
 let need=Math.floor(1000*Math.pow(V2.immortal.level,1.55));
 while(V2.immortal.level<V2.immortal.levelCap&&V2.immortal.exp>=need){
  V2.immortal.exp-=need;V2.immortal.level++;P.maxHp+=35;P.maxMp+=12;P.atk+=8;P.def+=5;P.magic+=7;P.hp=P.maxHp;P.mp=P.maxMp;
  need=Math.floor(1000*Math.pow(V2.immortal.level,1.55));log('仙界等级提升至 '+V2.immortal.level);
 }
 const next=REALMS.findIndex(r=>V2.immortal.level>=r.need*2+1);
 if(next>V2.immortal.realm&&next>=0){V2.immortal.realm=Math.min(REALMS.length-1,next);log('境界突破：'+REALMS[V2.immortal.realm].name);}
}
function finishAscension(){
 if(V2.ascension.tribulations<3){toast('尚未渡过三重天劫');return;}
 startBattle({name:'天劫帝君',hp:3200,atk:125,def:42,phase:0},'finalAscension');
}
function completeAscension(){
 V2.immortal.unlocked=true;V2.immortal.level=1;V2.immortal.exp=0;V2.immortal.realm=0;
 V2.ascension.completed=true;V2.ascension.completedAt=Date.now();
 V2.world.unlocked=['nantian'];V2.world.visited=['nantian'];V2.world.x=300;V2.world.y=300;
 grantItem('sword_cloud');V2.materials.仙玉+=300;
 log('飞升成功！凡间与仙界双线等级正式开启。');
 saveV2();P.hp=P.maxHp;P.mp=P.maxMp;
 toast('🌟 飞升成功！仙界开放世界已解锁');
}
const oldWinBattle=winBattle;
winBattle=function(){
 if(battleV2&&battleV2.type==='finalAscension'){battleV2=null;completeAscension();currentTab='overview';renderPanel();return;}
 oldWinBattle();
};
function addAscensionMenu(){
 const oldUpdate=updateHUD;
 if(typeof oldUpdate==='function'&&!oldUpdate.__v2){
  const wrapped=function(){oldUpdate();const lv=$v('pLv');if(lv){lv.innerHTML='凡 Lv.<b>'+Math.min(100,P.lv)+'</b>'+(V2.immortal.unlocked?' · 仙 <b>'+V2.immortal.level+'</b>':'');}};
  wrapped.__v2=true;updateHUD=wrapped;updateHUD();
 }
}
function capMortal(){
 if(typeof gainExp==='function'&&!gainExp.__v2){
  const old=gainExp;
  const wrapped=function(amount){
   amount=Math.max(0,Number(amount)||0);
   if(P.lv<100){
    let toCap=-Math.max(0,Number(P.exp)||0);
    for(let lv=P.lv;lv<100;lv++)toCap+=Math.floor(60*Math.pow(lv,1.65));
    const mortalGain=Math.min(amount,Math.max(0,toCap));
    if(mortalGain>0)old(mortalGain);
    if(P.lv>100){P.lv=100;P.exp=0;}
    const overflow=amount-mortalGain;
    if(overflow>0&&V2.immortal.unlocked){V2.immortal.exp+=overflow*.3;levelImmortal();}
    else if(overflow>0)toast('凡间等级已达上限，请完成飞升任务');
   }else if(V2.immortal.unlocked){V2.immortal.exp+=amount*.3;levelImmortal();}
   else{P.exp=0;if(amount>0)toast('凡间等级已达100，飞升后开启仙界等级');}
   if(P.lv>=100){P.lv=100;P.exp=0;}
   V2.mortal.level=P.lv;V2.mortal.exp=P.exp;
   if(typeof updateHUD==='function')updateHUD();
  };
  wrapped.__v2=true;gainExp=wrapped;
 }
}

function devEsc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function captureDevError(msg){V2.developer.errors.unshift({message:String(msg).slice(0,500),time:Date.now()});V2.developer.errors=V2.developer.errors.slice(0,40);}
function installDevErrorCapture(){
 if(window.__MHXY_DEV_ERROR_CAPTURE__)return;
 window.__MHXY_DEV_ERROR_CAPTURE__=true;
 window.addEventListener('error',e=>captureDevError((e.message||'运行时错误')+' '+(e.filename||'')+':'+(e.lineno||0)));
 window.addEventListener('unhandledrejection',e=>captureDevError('Promise异常：'+(e.reason&&e.reason.message||e.reason||'未知原因')));
}

  ['Boss奖励装备映射',()=>['sword_cloud','helm_star','armor_mist','boots_wind','ring_sun'].every(id=>EQUIP_BASE.some(x=>x.id===id))]
 ]}
};
function runDeveloperTests(suite='all'){
 const keys=suite==='all'?Object.keys(DEV_TEST_SUITES):[suite],t=[];
 keys.forEach(k=>{const g=DEV_TEST_SUITES[k];if(!g)return;g.tests.forEach(([name,fn])=>{try{const v=fn();t.push({suite:k,name,ok:v!==false,detail:v===true?'检查通过':v===false?'检查未通过':String(v)});}catch(e){t.push({suite:k,name,ok:false,detail:String(e)});}});});
 V2.developer.lastRun=Date.now();V2.developer.lastSuite=suite;V2.developer.results=t;saveV2();return t;
}
function renderDeveloper(){
 const d=V2.developer||{lastRun:0,results:[],errors:[]},rs=d.results||[],es=d.errors||[];
 const pass=rs.filter(x=>x.ok).length,fail=rs.length-pass;
 const rows=rs.length?rs.map(x=>'<div class="v2-test-row"><span><b>'+devEsc(x.name)+'</b><br><small class="v2-muted">'+devEsc(x.detail)+'</small></span><b class="'+(x.ok?'v2-test-ok':'v2-test-fail')+'">'+(x.ok?'通过':'失败')+'</b></div>').join(''):'<p class="v2-muted">尚未运行测试。选择分类测试，或运行全部新旧功能测试。</p>';
 const errors=es.length?es.map(x=>'['+new Date(x.time).toLocaleString()+'] '+x.message).join('\\n'):'暂无捕获到运行时错误。';
 const suiteButtons=Object.keys(DEV_TEST_SUITES).map(k=>btn('测试：'+DEV_TEST_SUITES[k].label,'dev:suite:'+k)).join('');
 return '<section class="v2-card v2-dev-card"><h3>开发者选项 <span class="v2-dev-tag">正式版常驻</span></h3><p class="v2-muted">集中测试1.7旧系统与2.0新增系统。每个分类可单独测试，也可一键完整回归。自动检查只读，不会修改角色数据。</p><div class="v2-row"><span>测试模块</span><b>'+DEV_VERSION+'</b></div><div class="v2-row"><span>最近测试</span><b>'+(d.lastRun?new Date(d.lastRun).toLocaleString():'尚未运行')+'</b></div><div class="v2-row"><span>本次结果</span><b class="v2-test-ok">'+pass+'通过</b><b class="v2-test-fail">'+fail+'失败</b></div><div class="v2-dev-actions">'+btn('运行全部新旧功能测试','dev:test','blue')+suiteButtons+'</div></section>'+
 '<section class="v2-card v2-dev-card"><h3>测试结果明细（'+rs.length+'项）</h3>'+rows+'</section>'+
'<section class="v2-card v2-dev-card"><h3>开发者快捷工具</h3><p class="v2-muted">以下操作会修改当前正式存档，执行前需要确认；建议先导出备份。</p><div class="v2-dev-actions">'+btn('气血法力回满','dev:heal')+btn('立即保存存档','dev:save')+btn('重新运行全部测试','dev:test')+'</div></section>'+
 '<section class="v2-card v2-dev-card"><h3>运行时错误日志（'+es.length+'）</h3><div class="v2-dev-log">'+devEsc(errors)+'</div><div style="margin-top:8px">'+btn('清空错误日志','dev:clearlogs','red')+'</div></section>'+
 '<section class="v2-card"><h3>永久保留规则</h3><p class="v2-muted">开发者选项属于正式游戏功能。以后每个新增或修改的功能，都必须在这里添加对应测试按钮与回归检查；正式版发布时保留，不会删除。</p></section>';
}
function handleDeveloperAction(a){
 const ask=m=>typeof window.confirm==='function'?window.confirm(m):true;
 if(a==='test'||a==='suite:all'||a.startsWith('suite:')){
  const suite=a==='test'||a==='suite:all'?'all':a.slice(6),r=runDeveloperTests(suite),n=r.filter(x=>!x.ok).length;
  toast(n?'测试完成，需处理 '+n+' 项':'测试完成，'+r.length+' 项全部通过');renderPanel();return;
 }
 if(a==='level100'){toast('凡间等级测试工具已停用，保留1.7原成长规则');return;}
 if(a==='ascend'||a==='materials'||a==='gear'||a==='battle'){toast('仙界相关开发工具已停用');return;}
 if(a==='materials'){if(!ask('给所有仙界材料增加999？'))return;Object.keys(V2.materials).forEach(k=>V2.materials[k]=(Number(V2.materials[k])||0)+999);saveV2();toast('测试材料已增加');renderPanel();return;}
 if(a==='heal'){P.hp=P.maxHp;P.mp=P.maxMp;updateHUD();saveV2();toast('状态已回满');renderPanel();return;}
 if(a==='gear'){if(!ask('把全部测试装备加入背包？'))return;EQUIP_BASE.forEach(x=>grantItem(x.id));saveV2();toast('测试装备已加入');renderPanel();return;}
 if(a==='battle'){if(!V2.immortal.unlocked&&!ask('尚未飞升，仍要生成仙界测试战斗吗？'))return;startBattle({name:'开发者测试木桩',hp:1800,atk:1,def:0,phase:0},'debug');return;}
 if(a==='save'){toast(saveV2()?'存档已保存':'存档保存失败');renderPanel();return;}
 if(a==='clearlogs'){if(!ask('只清空错误日志，不会删除游戏存档。继续？'))return;V2.developer.errors=[];saveV2();renderPanel();toast('日志已清空');}
}
window.__MHXY_DEVTOOLS__={version:DEV_VERSION,runTests:runDeveloperTests,getSuites:()=>Object.keys(DEV_TEST_SUITES),getErrors:()=>clone(V2.developer.errors||[])};

function init(){
 if(typeof P==='undefined'||!$v('game'))return;
 loadV2();installDevErrorCapture();wrapSave();injectStyles();addMenu();ensureRoot();
 // 保留1.7原等级成长规则，不再施加2.0凡间等级上限或仙界装备赠送。
 V2.mortal.level=Math.max(1,Number(P.lv)||1);V2.mortal.exp=Math.max(0,Number(P.exp)||0);
 saveV2();
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveV2();});
 window.addEventListener('beforeunload',saveV2);
 // 监听原游戏经验成长后的等级变化，防止凡间超过100。
 const oldAddLog=typeof addLog==='function'?addLog:null;
 if(oldAddLog&&!oldAddLog.__v2){const w=function(){return oldAddLog.apply(this,arguments);};w.__v2=true;}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
</body>
</html>
